<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FDE Station</title>
  <!-- issue #42：内联 SVG favicon（原 404） -->
  <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><rect width="16" height="16" rx="3" fill="%230a7"/><text x="8" y="12" font-size="10" text-anchor="middle" fill="%23fff" font-family="sans-serif">F</text></svg>'>
  <style>
    :root { --bd: #ddd; --muted: #666; --brand: #0a7; }
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; margin: 0; color: #222; height: 100vh; display: flex; flex-direction: column; }
    header { padding: .6rem 1rem; border-bottom: 1px solid var(--bd); display: flex; gap: 1rem; align-items: center; }
    header h1 { font-size: 1.05rem; margin: 0; }
    header .who { color: var(--muted); font-size: .85rem; flex: 1; }
    header a { color: var(--brand); font-size: .85rem; text-decoration: none; }
    header button { padding: .35rem .8rem; }
    main { flex: 1; display: flex; min-height: 0; }
    aside { width: 15rem; border-right: 1px solid var(--bd); overflow-y: auto; padding: .5rem; }
    aside .proj { margin-bottom: .8rem; }
    aside select, aside input, aside button { width: 100%; padding: .4rem; margin-top: .3rem; }
    #newProjForm { margin-top: .4rem; }
    #newProjForm .actions { display: flex; gap: .35rem; }
    #newProjForm .actions button { flex: 1; }
    aside .sess { border: 1px solid var(--bd); border-radius: 6px; padding: .45rem; margin-top: .4rem; cursor: pointer; font-size: .88rem; }
    aside .sess.active { border-color: var(--brand); background: #f2fff9; }
    aside .sess .meta { color: var(--muted); font-size: .75rem; }
    #chat { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    #stream { flex: 1; overflow-y: auto; padding: 1rem; }
    .msg { margin: .4rem 0; padding: .55rem .8rem; border-radius: 8px; max-width: 46rem; white-space: pre-wrap; word-break: break-word; }
    .msg.user { background: #e8f4ff; margin-left: auto; }
    .msg.assistant { background: #f6f6f6; }
    .msg.synthetic { border-left: 3px solid #d80; background: #fffaf0; }
    .card { border: 1px solid var(--bd); border-left: 3px solid #888; border-radius: 6px; padding: .4rem .7rem; margin: .35rem 0; font-size: .85rem; max-width: 46rem; background: #fbfbfb; }
    .card.ok { border-left-color: #2a2; }
    .card.err { border-left-color: #b33; }
    .card .t { font-weight: 600; }
    .card .dig { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .roundsep { color: var(--muted); font-size: .75rem; margin: .6rem 0 .2rem; }
    .syserr { color: #b33; font-size: .85rem; }
    /* issue #40：Markdown 子集渲染（仅助手终稿；用户/系统注入保持纯文本） */
    .msg.md { white-space: normal; line-height: 1.55; }
    .md > :first-child { margin-top: 0; }
    .md > :last-child { margin-bottom: 0; }
    .md p { margin: .35rem 0; }
    .md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { margin: .55rem 0 .3rem; line-height: 1.3; }
    .md h1 { font-size: 1.3rem; } .md h2 { font-size: 1.18rem; } .md h3 { font-size: 1.08rem; }
    .md h4, .md h5, .md h6 { font-size: 1rem; }
    .md code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: #ececec; border-radius: 4px; padding: .08rem .32rem; font-size: .86em; }
    .md-code { border: 1px solid var(--bd); border-radius: 6px; margin: .45rem 0; background: #fbfbfb; }
    .md-code .md-lang { padding: .15rem .55rem; font-size: .72rem; color: var(--muted); border-bottom: 1px solid var(--bd); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .md-code pre { margin: 0; padding: .55rem .7rem; overflow-x: auto; }
    .md-code pre code { background: none; padding: 0; font-size: .84rem; display: block; white-space: pre; }
    .md ul, .md ol { margin: .35rem 0; padding-left: 1.5rem; }
    .md li { margin: .12rem 0; }
    .md blockquote { border-left: 3px solid #ccc; margin: .4rem 0; padding: .05rem .75rem; color: #555; }
    .md table { border-collapse: collapse; margin: .45rem 0; }
    .md th, .md td { border: 1px solid var(--bd); padding: .3rem .65rem; font-size: .86rem; }
    .md th { background: #f0f0f0; }
    .md a { color: #06c; word-break: break-all; }
    #composer { border-top: 1px solid var(--bd); padding: .7rem; display: flex; gap: .6rem; }
    #composer textarea { flex: 1; padding: .5rem; resize: none; height: 3.2rem; }
    #composer button { padding: .5rem 1.1rem; }
    #stopBtn { display: none; background: #fff2f0; border-color: #b33; color: #b33; }
    .muted { color: var(--muted); font-size: .8rem; }
    /* issue #55 A2：「↓ 最新」悬浮按钮（离开底部自动跟随暂停时出现） */
    #chat { position: relative; }
    #toLatest { position: absolute; right: 1.2rem; bottom: 5.6rem; z-index: 5; display: none;
                border-radius: 999px; border: 1px solid var(--bd); background: #fff; color: var(--brand);
                padding: .35rem .9rem; box-shadow: 0 2px 8px rgba(0,0,0,.12); cursor: pointer; }
    /* issue #55 B4：≤768px 侧栏变固定抽屉（默认收起），backdrop 半透明遮罩点击关闭 */
    #navToggle { display: none; }
    #backdrop { display: none; }
    @media (max-width: 768px) {
      #navToggle { display: inline-block; }
      aside { position: fixed; top: 0; left: 0; bottom: 0; width: 16rem; z-index: 30;
              background: #fff; transform: translateX(-100%); transition: transform .2s ease; }
      body.drawer-open aside { transform: none; }
      #backdrop { display: block; position: fixed; inset: 0; z-index: 25; background: rgba(0,0,0,.4);
                  opacity: 0; pointer-events: none; transition: opacity .2s ease; }
      body.drawer-open #backdrop { opacity: 1; pointer-events: auto; }
    }
    /* issue #42：禁用态视觉变灰 */
    button:disabled, textarea:disabled, select:disabled { opacity: .45; cursor: not-allowed; }
  </style>
</head>
<body>
  <header>
    <button id="navToggle" aria-label="打开导航">导航</button>
    <h1>FDE Station</h1>
    <span class="who" id="who"></span>
    <a id="adminLink" href="/admin" style="display:none">管理台</a>
    <button id="logout">登出</button>
  </header>
  <main>
    <div id="backdrop"></div>
    <aside>
      <div class="proj" id="projBox">
        <label class="muted">项目</label>
        <select id="projectSel"></select>
        <div id="projectMeta" class="muted"></div>
        <button id="newProj">＋ 新项目</button>
        <form id="newProjForm" style="display:none" novalidate>
          <label class="muted" for="newProjName">项目名（小写字母/数字/连字符）</label>
          <input id="newProjName" name="name" required maxlength="63" placeholder="例如 my-project">
          <label class="muted" for="newProjRepo">关联仓库（可选）</label>
          <input id="newProjRepo" name="repo_url" placeholder="https://git.example/org/project.git">
          <div class="actions">
            <button type="submit">创建</button>
            <button type="button" id="newProjCancel">取消</button>
          </div>
          <p id="newProjErr" class="syserr" role="alert"></p>
        </form>
      </div>
      <button id="newSess">＋ 新会话</button>
      <div id="sessList"></div>
    </aside>
    <section id="chat">
      <div id="stream"><p class="muted">选择或新建会话</p></div>
      <div id="composer">
        <textarea id="input" placeholder="输入任务，Enter 发送（Shift+Enter 换行）"></textarea>
        <button id="sendBtn">发送</button>
        <button id="stopBtn">■ 停止</button>
      </div>
      <button id="toLatest" type="button">↓ 最新</button>
    </section>
  </main>
  <script src="/markdown.js"></script>
  <script>
    'use strict';
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    const S = { user: null, projects: [], projectId: null, sessions: [], sessionId: null,
                lastSeq: 0, es: null, esSessionId: null, activeRunId: null, deltaBuf: null, toolCards: {}, renderedIds: null,
                projectReqSeq: 0, sessionReqSeq: 0, ctxSeq: 0, autoFollow: true }; // 项目/会话请求序号与项目上下文代次（迟到响应丢弃）
    // issue #55 A1：per-session 输入草稿（内存 Map，key=sessionId）；切换会话/项目时保存与恢复
    const drafts = new Map();
    // 评审修复：统一的草稿暂存——有值 set、空值 delete（恢复后手动清空须能真正清掉）；无选中会话不动。
    // openSession / switchProject / resetSessionView 三条「离开会话」路径共用，替换原先的 if(value) set 写法。
    function saveDraft() {
      if (!S.sessionId) return;
      const v = $('input').value;
      if (v) drafts.set(S.sessionId, v);
      else drafts.delete(S.sessionId);
    }
    const AUTO_FOLLOW_GAP = 80; // issue #55 A2：距底超过该值视为「离开底部」，暂停自动跟随
    // issue #42：run_end 分级文案的异常终止集合（end_turn 之外的正常/未知原因保持灰色中性）
    const RUN_FAIL_REASONS = new Set(['failed', 'max_rounds_cap', 'aborted']);
    const PROJECT_NAME_RE = /^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$/;

    async function api(path, opts = {}) {
      const r = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...opts });
      const body = await r.json().catch(() => ({}));
      if (!r.ok) throw Object.assign(new Error(body.error?.message ?? r.status), { code: body.error?.code, status: r.status });
      return body;
    }

    function afterLoginRoute(user) {
      if (user && user.role === 'admin' && !user.fde_name) {
        location.replace('/admin');
        return;
      }
      location.reload();
    }

    async function boot() {
      try {
        const me = await api('/api/me');
        S.user = me.user;
      } catch { renderLogin(); return; }
      $('who').textContent = `${S.user.login}（${S.user.role}${S.user.fde_name ? ' / ' + S.user.fde_name : ''}）`;
      $('adminLink').style.display = S.user.role === 'admin' ? '' : 'none';
      $('logout').onclick = async () => { await fetch('/api/auth/logout', { method: 'POST' }); location.reload(); };
      await initWorkspace();
    }

    function renderLogin() {
      $('who').textContent = '未登录';
      // issue #42：未登录隐藏侧栏「＋新项目 / ＋新会话」与项目选择区（登出后 reload 走本路径，同样生效）
      $('projBox').style.display = 'none';
      $('newSess').style.display = 'none';
      $('sessList').innerHTML = '';
      $('stream').innerHTML = '';
      $('composer').style.display = 'none';
      const div = document.createElement('div');
      div.style.cssText = 'max-width:22rem;margin:4rem auto;padding:1.5rem;border:1px solid #ddd;border-radius:10px';
      div.innerHTML = `
        <h2 style="margin-top:0">FDE Station 登录</h2>
        <form id="loginForm">
          <label class="muted">登录名</label><input name="login" autocomplete="username" style="width:100%;padding:.4rem;margin:.2rem 0 .6rem">
          <label class="muted">口令</label><input name="password" type="password" autocomplete="current-password" style="width:100%;padding:.4rem;margin:.2rem 0 .6rem">
          <button style="width:100%;padding:.5rem">下一步</button>
        </form>
        <form id="totpForm" style="display:none">
          <p class="muted">输入认证器 6 位码（本地账号两步登录）。</p>
          <label class="muted">TOTP</label><input id="totpCode" name="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" style="width:100%;padding:.4rem;margin:.2rem 0 .6rem">
          <button style="width:100%;padding:.5rem">验证并登录</button>
          <button type="button" id="backToLogin" style="width:100%;padding:.5rem;margin-top:.4rem">← 返回重新登录</button>
        </form>
        <p id="loginErr" class="syserr"></p>`;
      $('stream').appendChild(div);
      $('loginForm').onsubmit = async (e) => {
        e.preventDefault();
        const f = e.target;
        try {
          const r = await fetch('/api/auth/login', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ login: f.login.value.trim(), password: f.password.value }),
          });
          const body = await r.json().catch(() => ({}));
          if (!r.ok) throw new Error(body?.error?.message || `请求失败（HTTP ${r.status}）`);
          const data = body;
          if (data.user) { afterLoginRoute(data.user); return; } // 未注册 TOTP：密码直通会话
          S.pendingToken = data.pending_token;
          $('loginForm').style.display = 'none';
          $('totpForm').style.display = '';
          $('loginErr').textContent = '';
          $('totpCode').focus();
        } catch (err) { $('loginErr').textContent = err.message; }
      };
      $('backToLogin').onclick = () => location.reload();
      $('totpForm').onsubmit = async (e) => {
        e.preventDefault();
        try {
          const r = await fetch('/api/auth/login/totp', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ pending_token: S.pendingToken, code: e.target.code.value.trim() }),
          });
          const body = await r.json().catch(() => ({}));
          if (!r.ok) throw new Error(body?.error?.message || `请求失败（HTTP ${r.status}）`);
          afterLoginRoute(body.user);
        } catch (err) { $('loginErr').textContent = err.message; }
      };
    }

    async function initWorkspace() {
      $('composer').style.display = '';
      $('projBox').style.display = '';
      $('newSess').style.display = '';
      const projectForm = $('newProjForm');
      const projectNameInput = $('newProjName');
      const projectRepoInput = $('newProjRepo');
      const projectError = $('newProjErr');
      $('newProj').onclick = () => {
        projectForm.style.display = '';
        projectError.textContent = '';
        projectNameInput.focus();
      };
      $('newProjCancel').onclick = () => {
        projectForm.reset();
        projectForm.style.display = 'none';
        projectError.textContent = '';
      };
      projectForm.onsubmit = async (e) => {
        e.preventDefault();
        const name = projectNameInput.value.trim();
        const repo = projectRepoInput.value.trim();
        projectError.textContent = '';
        if (!PROJECT_NAME_RE.test(name)) {
          projectError.textContent = '项目名必须符合：小写字母/数字/连字符，且不能以连字符开头或结尾（最多 63 个字符）';
          projectNameInput.focus();
          return;
        }
        const payload = { name, template: 'node' };
        if (repo) payload.repo_url = repo;
        try {
          const { project } = await api('/api/projects', { method: 'POST', body: JSON.stringify(payload) });
          S.projects.push(project);
          const sel = $('projectSel');
          sel.innerHTML = S.projects.map((p) => `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('');
          sel.value = project.id;
          updateWorkspaceAvailability(); // 验收 major-1：首个项目创建后须解除输入区/发送/「＋新会话」禁用
          projectForm.reset();
          projectForm.style.display = 'none';
          try {
            await switchProject(project.id);
          } catch {
            const div = document.createElement('div');
            div.className = 'syserr';
            div.textContent = '项目已创建；会话列表加载失败，可切换项目重试';
            $('stream').appendChild(div);
            scrollDown();
          }
        } catch (e) { projectError.textContent = e.message; }
      };

      const pj = await api('/api/projects');
      S.projects = pj.items ?? [];
      const sel = $('projectSel');
      sel.innerHTML = S.projects.map((p) => `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('');
      S.projectId = S.projects[0]?.id ?? null;
      updateProjectMeta();
      updateWorkspaceAvailability(); // issue #42：无项目 → 禁用输入区/发送/「＋新会话」
      // 验收 major-2：onchange 无条件绑定（在空项目 early return 之前，否则从零项目开始时切换项目永不加载会话）
      sel.onchange = () => switchProject(sel.value);
      if (S.projects.length === 0) {
        const isPlatformAdmin = S.user.role === 'admin' && !S.user.fde_name;
        const emptyText = isPlatformAdmin ? '平台管理员：请到管理台创建 FDE 用户与分配资源' : '先创建项目';
        const adminLink = isPlatformAdmin ? '<br><a href="/admin">进入管理台</a>' : '';
        $('sessList').innerHTML = `<p class="muted">${esc(emptyText)}${adminLink}</p>`;
        $('stream').innerHTML = isPlatformAdmin
          ? `<p class="muted">${esc(emptyText)}${adminLink}</p>`
          : '<p class="muted">选择或新建会话</p>';
        return;
      }
      await loadSessions();
      // issue #55 B1：启动时若 URL 带 #/session/<id>，走统一深链解析（列表内直接打开；列表外走 detail 端点）
      const hashSid = currentHashSession();
      if (hashSid) await resolveHashSession(hashSid);
    }

    async function switchProject(projectId, { loadSessions: shouldLoadSessions = true } = {}) {
      if (S.es) { S.es.close(); S.es = null; }
      // issue #55 A1：离开旧会话前保存输入草稿（空值则清除）；B1：切项目即无选中会话，清深链
      saveDraft();
      $('input').value = '';
      clearRoute();
      S.ctxSeq++;
      S.projectReqSeq++;
      S.projectId = projectId;
      // 评审修复：程序化切换（如深链跨项目解析）同步 <select>，防 UI 选中项与 S.projectId 失步
      $('projectSel').value = projectId;
      S.sessionId = null;
      S.activeRunId = null;
      S.lastSeq = 0;
      S.deltaBuf = null;
      S.toolCards = {};
      S.renderedIds = null;
      S.esSessionId = null;
      S.sessions = [];
      // 评审修复：与 resetSessionView 对齐的状态复位（自动跟随恢复、隐藏「↓ 最新」、收起移动端抽屉）
      S.autoFollow = true; $('toLatest').style.display = 'none';
      document.body.classList.remove('drawer-open');
      $('stream').innerHTML = '<p class="muted">选择或新建会话</p>';
      setRunning(false);
      updateProjectMeta();
      renderSessions();
      if (shouldLoadSessions && S.projectId) await loadSessions();
    }

    function updateProjectMeta() {
      const project = S.projects.find((p) => String(p.id) === String(S.projectId));
      $('projectMeta').textContent = project
        ? `${project.root_path || `~/projects/${project.name}`}${project.repo_url ? ` · 仓库：${project.repo_url}` : ''}`
        : '';
    }

    // issue #42：无项目时禁用输入框/发送/「＋新会话」，placeholder 引导建项目或进入管理台。
    function updateWorkspaceAvailability() {
      const hasProject = S.projects.length > 0;
      const isPlatformAdmin = S.user.role === 'admin' && !S.user.fde_name;
      S.noProject = !hasProject;
      $('input').disabled = !hasProject;
      $('input').placeholder = isPlatformAdmin
        ? '平台管理员：请到管理台创建 FDE 用户与分配资源'
        : hasProject ? '输入任务，Enter 发送（Shift+Enter 换行）' : '先创建项目';
      $('newProj').disabled = isPlatformAdmin;
      $('newSess').disabled = !hasProject;
      if (!S.activeRunId) $('sendBtn').disabled = !hasProject;
    }

    async function loadSessions() {
      // 评审 LOW-3：请求序号守卫——快速 A→B 切换时，A 的迟到响应不得覆盖 B 的会话列表
      const reqSeq = ++S.projectReqSeq;
      const data = await api(`/api/sessions?project_id=${encodeURIComponent(S.projectId)}`);
      if (reqSeq !== S.projectReqSeq) return; // 过期响应：projectId 已变，丢弃
      S.sessions = data.items ?? [];
      renderSessions();
    }

    function renderSessions() {
      $('sessList').innerHTML = S.sessions.map((s) =>
        `<div class="sess ${s.id === S.sessionId ? 'active' : ''}" data-id="${esc(s.id)}">` +
        `<div>${esc(s.title || '未命名会话')}</div>` +
        `<div class="meta">${s.active_run_id ? '● 运行中' : esc(new Date(s.updated_at).toLocaleString('zh-CN'))}</div></div>`
      ).join('') || '<p class="muted">暂无会话</p>';
      for (const el of $('sessList').querySelectorAll('.sess')) {
        el.onclick = () => openSession(el.dataset.id);
      }
    }

    $('newSess').onclick = async () => {
      const ctx = S.ctxSeq;
      $('newSess').disabled = true;
      try {
        const { session } = await api('/api/sessions', { method: 'POST', body: JSON.stringify({ project_id: S.projectId }) });
        if (ctx !== S.ctxSeq) return;
        S.sessions.unshift({ ...session, has_active_run: false });
        renderSessions();
        openSession(session.id);
      } catch (e) {
        if (ctx !== S.ctxSeq) return;
        alert('建会话失败：' + e.message);
      } finally {
        updateWorkspaceAvailability();
      }
    };

    async function openSession(id, { syncRoute = true } = {}) {
      const reqSeq = ++S.sessionReqSeq;
      const ctx = S.ctxSeq;
      // 评审修复：同会话重开只刷新路由（replaceState），不重复 push——保留点击刷新语义，只修历史记录膨胀
      const isReopen = String(id) === String(S.sessionId);
      if (S.es) { S.es.close(); S.es = null; }
      // issue #55 A1：离开旧会话前保存输入草稿（空值则清除），切回时恢复；B4：移动端选中会话后自动收起抽屉
      saveDraft();
      $('input').value = drafts.get(id) ?? '';
      document.body.classList.remove('drawer-open');
      S.sessionId = id; S.lastSeq = 0; S.activeRunId = null; S.deltaBuf = null; S.toolCards = {};
      S.esSessionId = id;
      S.autoFollow = true; $('toLatest').style.display = 'none';
      if (syncRoute) {
        const url = `#/session/${encodeURIComponent(id)}`;
        if (isReopen) history.replaceState(null, '', url);
        else history.pushState(null, '', url);
      }
      $('stream').innerHTML = '';
      renderSessions();
      let data;
      try {
        data = await api(`/api/sessions/${encodeURIComponent(id)}`);
      } catch (e) {
        if (reqSeq !== S.sessionReqSeq || ctx !== S.ctxSeq) return;
        if (e.code === 'not_found' || e.status === 404) {
          resetSessionView(); // issue #55 B1：会话不存在（如已被删除/深链失效）：静默回退默认视图（清 hash）
          return;
        }
        // 评审修复：其他错误（网络/5xx）区分处理——保留 hash（可刷新重试）+ stream 区 syserr
        const div = document.createElement('div');
        div.className = 'syserr';
        div.textContent = '会话加载失败，可刷新重试';
        $('stream').appendChild(div);
        return;
      }
      if (reqSeq !== S.sessionReqSeq || ctx !== S.ctxSeq) return;
      S.lastSeq = data.last_seq;
      S.renderedIds = new Set();
      for (const m of data.messages) addMessage(m);
      if (data.session.active_run_id) { S.activeRunId = data.session.active_run_id; setRunning(true); }
      connectEvents(id);
    }

    function connectEvents(id, lastEventId = null) {
      // §5.2：带 ?last_event_id=<seq> 重连 → 服务端补发 seq > last_event_id 的事件；无参 = 首连不补发历史。
      const q = lastEventId != null ? `?last_event_id=${encodeURIComponent(lastEventId)}` : '';
      const es = new EventSource(`/api/sessions/${encodeURIComponent(id)}/events${q}`);
      S.es = es;
      S.esSessionId = id;
      es.onmessage = () => {}; // 具名事件分发
      for (const type of ['round_start','round_end','attempt','recovering','recovered','usage',
                          'tool_use','tool_result','assistant_delta','reasoning_delta',
                          'tool_call_delta','judge','compaction','final_guard','forced_final','run_end','ping','resync']) {
        // 陈旧连接的事件一律忽略（重连后旧连接可能还有在途帧，防重复渲染/重复推进水位线）
        es.addEventListener(type, (e) => { if (S.es !== es) return; handleEvent(type, e); });
      }
      es.onerror = () => { /* EventSource 自动重连，带 Last-Event-ID */ };
    }

    // 需重同步（仅由服务端 `resync` 控制帧触发，如补发前缓冲溢出）：主动断开 +
    // 带 ?last_event_id=<本地已知最大 seq> 重连，由服务端补发 seq > last_event_id 收敛（§5.2）。
    // 注：**不**做客户端「seq 跳号 → 重连」启发式——messages 与 run_events 共用 chat_sessions.last_seq
    // 分配器（schema.sql §3），事件流单独看存在**合法空洞**（user 消息/assistant 回写各占一个 seq），
    // 跳号判定会无限重连（实测复现）；断线恢复靠 EventSource 自动重连（带 Last-Event-ID）与服务端 resync。
    function resyncEvents(why) {
      const id = S.esSessionId ?? S.sessionId;
      if (!id) return;
      sep(`事件流需重同步（${why}），正在重连补发…`);
      if (S.es) { try { S.es.close(); } catch { /* 忽略 */ } S.es = null; }
      connectEvents(id, S.lastSeq);
    }

    function addMessage(m) {
      if (S.renderedIds) {
        if (S.renderedIds.has(m.id)) return m; // 去重（refresh 与流式缓冲竞态）
        S.renderedIds.add(m.id);
      }
      const div = document.createElement('div');
      div.className = `msg ${m.role}${m.synthetic ? ' synthetic' : ''}`;
      // issue #40：仅助手终稿渲染 Markdown 子集（markdown.js 先转义后格式化，XSS 安全）；
      // 用户消息与系统注入（synthetic）保持 textContent 纯文本。流式增量（deltaBuf）全程
      // textContent 追加，run_end 终稿经 refreshSession → addMessage 整体渲染（半截 ``` 不炸布局）。
      if (m.role === 'assistant' && !m.synthetic && typeof renderMarkdown === 'function') {
        div.classList.add('md');
        div.innerHTML = renderMarkdown(m.content);
      } else {
        div.textContent = (m.synthetic ? '〔系统注入〕' : '') + m.content;
      }
      $('stream').appendChild(div);
      scrollDown();
      return div;
    }

    function toolCard(callId, name, input) {
      if (S.toolCards[callId]) return S.toolCards[callId];
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `<div class="t">🔧 ${esc(name ?? 'tool')} <span class="dig"></span></div><div class="out muted"></div>`;
      card.querySelector('.dig').textContent = typeof input === 'object' ? JSON.stringify(input ?? {}).slice(0, 120) : String(input ?? '').slice(0, 120);
      $('stream').appendChild(card);
      S.toolCards[callId] = card;
      scrollDown();
      return card;
    }

    function handleEvent(type, e) {
      let d;
      try { d = e.data ? JSON.parse(e.data) : {}; } catch { return; } // 畸形事件忽略（§5.3）
      if (type === 'resync') { resyncEvents(d.reason === 'buffer_overflow' ? '服务端缓冲溢出' : (d.reason ?? 'resync')); return; }
      // 实现注记（§5.1）：事件流 seq 有合法空洞（messages 占号），故**不做**跳号重连判定；
      // 这里只推进本地水位线（resync 重连时作为 ?last_event_id 回放游标）。
      if (typeof d.seq === 'number') S.lastSeq = Math.max(S.lastSeq, d.seq);
      switch (type) {
        case 'ping': return;
        case 'round_start':
          if (S.deltaBuf) { S.deltaBuf = null; }
          sep(`round ${d.round}`); return;
        case 'attempt': sep(`round ${d.round} · 尝试 ${d.attempt}/${d.maxAttempts}`); return;
        case 'recovering': sep(`重试中（${d.attempt}/${d.maxAttempts}）`); return;
        case 'recovered': sep('重试成功'); return;
        case 'assistant_delta': {
          if (!S.deltaBuf) {
            const div = document.createElement('div');
            div.className = 'msg assistant';
            div.textContent = '';
            $('stream').appendChild(div);
            S.deltaBuf = div;
          }
          S.deltaBuf.textContent += d.text ?? '';
          scrollDown(); return;
        }
        case 'reasoning_delta': return; // 推理增量 P1 不展示
        case 'tool_call_delta': {
          if (d.tool_call_id) {
            const card = toolCard(d.tool_call_id, d.name ?? '', '（参数流式生成中…）');
            card.dataset.args = (card.dataset.args ?? '') + (d.arguments_delta ?? '');
          }
          return;
        }
        case 'tool_use': {
          const card = toolCard(d.tool_call_id, d.name, d.input);
          card.dataset.args = typeof d.input === 'object' ? JSON.stringify(d.input ?? {}) : String(d.input ?? '');
          return;
        }
        case 'tool_result': {
          const card = S.toolCards[d.tool_call_id];
          if (card) {
            card.classList.add(d.ok ? 'ok' : 'err');
            card.querySelector('.out').textContent = `${d.ok ? '✓' : '✗'} ${d.result_digest ?? ''}（${d.duration_ms ?? 0}ms）`;
          }
          return;
        }
        case 'judge': {
          // 0.9.0 引擎载荷（已对源码核实）：extend/extendReason/plan 在 d.decision 内
          // （orchestrator round judge）；passThrough 挂在 intercept 类事件上
          // （checkpoint-executor，action='executed' + passThrough='on_track'|'readonly'）。
          const dec = d.decision ?? {};
          if (d.passThrough) { sep(`judge：放行（${d.passThrough}）`); return; }
          if (dec.extend === true) {
            sep(`judge：扩轮${dec.plan ? ' — ' + String(dec.plan).slice(0, 80) : ''}${dec.extendReason ? '（' + String(dec.extendReason).slice(0, 60) + '）' : ''}`);
            return;
          }
          if (dec.extend === false) {
            sep(`judge：不扩轮${dec.extendReason ? ' — ' + String(dec.extendReason).slice(0, 80) : ''}`);
            return;
          }
          if (d.kind === 'intercept' || d.action) {
            sep(`judge：${d.action ?? ''}${dec.reason ? ' — ' + dec.reason : ''}`);
          }
          return;
        }
        // 0.9.0 新事件类型（issue #43）：compaction = 上下文折叠（详情在 d.compaction，
        // orchestrator recordCompactionStat）；final_guard = 终稿核验（action ∈ accept/skip/
        // revise/degraded/error）；forced_final = 最后一轮强制无 tools 文本终稿（termination.js）。
        // P1 仅状态行展示，不参与运行态状态机。
        case 'compaction': {
          const c = d.compaction ?? {};
          sep(`上下文折叠（round ${d.round}）：${c.foldedRounds ?? 0} 轮折叠，${c.tokensBefore ?? '?'} → ${c.tokensAfter ?? '?'} tokens`);
          return;
        }
        case 'final_guard': sep(`final guard：${d.action ?? 'unknown'}${d.reason ? ` — ${d.reason}` : ''}`); return;
        case 'forced_final': sep(`forced final（round ${d.round}）：${d.reason ?? ''}`); return;
        case 'usage': return;
        case 'run_end': {
          // 历史重放的旧 run_end 不参与运行态状态机（防误关当前 run 的停止按钮/误拉刷新）
          const isCurrent = d.run_id === S.activeRunId;
          if (isCurrent) {
            notifyRunEnd(d); // issue #55 A7：运行完成桌面通知（页面在后台时）
            // 移除流式增量气泡（终稿由 refreshSession 回写，防双份）
            if (S.deltaBuf) { S.deltaBuf.remove(); S.deltaBuf = null; }
            const reason = d.termination?.reason ?? '';
            const usage = d.usage ? ` · tokens ${d.usage.input_tokens ?? 0}+${d.usage.output_tokens ?? 0}` : '';
            // issue #42：终止原因分级——failed/max_rounds_cap/aborted 红色告警，end_turn 灰色中性
            if (RUN_FAIL_REASONS.has(reason)) {
              const div = document.createElement('div');
              div.className = 'syserr';
              div.textContent = `run 结束：${reason}${usage}`;
              $('stream').appendChild(div);
            } else {
              sep(`run 结束：${reason === 'end_turn' ? '正常完成' : reason}${usage}`);
            }
            if (d.error) {
              const div = document.createElement('div');
              div.className = 'syserr';
              div.textContent = `run 失败：${d.error.code} — ${d.error.message}`;
              $('stream').appendChild(div);
            }
            S.activeRunId = null;
            setRunning(false);
            refreshSession(d.run_id);
          }
          return;
        }
        default: return; // 未知类型忽略（§5.3 向后兼容）
      }
    }

    async function refreshSession(runId) {
      const reqSeq = S.sessionReqSeq;
      const ctx = S.ctxSeq;
      const sid = S.sessionId;
      try {
        const data = await api(`/api/sessions/${encodeURIComponent(sid)}`);
        if (reqSeq !== S.sessionReqSeq || ctx !== S.ctxSeq || S.sessionId !== sid) return;
        const msgs = data.messages.filter((m) => m.run_id === runId && m.role === 'assistant' && !m.synthetic);
        for (const m of msgs) addMessage(m);
        await loadSessions();
      } catch { /* 尽力 */ }
    }

    function sep(text) {
      const div = document.createElement('div');
      div.className = 'roundsep';
      div.textContent = text;
      $('stream').appendChild(div);
      scrollDown();
    }

    function scrollDown() { if (!S.autoFollow) return; $('stream').scrollTop = $('stream').scrollHeight; }

    // issue #55 A2：用户向上滚动离开底部时暂停自动跟随并显示「↓ 最新」；回到底部附近自动恢复跟随
    $('stream').addEventListener('scroll', () => {
      const el = $('stream');
      const gap = el.scrollHeight - el.scrollTop - el.clientHeight;
      if (gap > AUTO_FOLLOW_GAP) {
        if (S.autoFollow) { S.autoFollow = false; $('toLatest').style.display = 'block'; }
      } else if (!S.autoFollow) {
        S.autoFollow = true; $('toLatest').style.display = 'none';
      }
    });
    $('toLatest').onclick = () => {
      S.autoFollow = true; $('toLatest').style.display = 'none';
      $('stream').scrollTop = $('stream').scrollHeight;
    };

    // issue #55 B1：hash 深链 #/session/<id>（portal 静态服务无 pathname 通配，hash 路由刷新/分享均安全）
    function currentHashSession() {
      const m = location.hash.match(/^#\/session\/([^/]+)/);
      return m ? decodeURIComponent(m[1]) : null;
    }
    function clearRoute() { history.replaceState(null, '', location.pathname + location.search); }

    // 评审修复：hash 深链统一解析——当前项目列表内直接打开；列表外走 detail 端点：
    // 跨项目 → 切项目后打开（含 select 同步）；同项目（分页外的旧会话）→ 直接打开；
    // 404/not_found → 静默回退默认视图（清 hash）；其他错误 → 保留 hash + syserr「会话加载失败，可刷新重试」。
    async function resolveHashSession(sid) {
      if (S.sessions.some((s) => String(s.id) === String(sid))) {
        openSession(sid, { syncRoute: false });
        return;
      }
      let session;
      try {
        ({ session } = await api(`/api/sessions/${encodeURIComponent(sid)}`));
      } catch (e) {
        if (e.code === 'not_found' || e.status === 404) {
          resetSessionView(); // 深链失效：静默回退默认视图（含清 hash）
          return;
        }
        const div = document.createElement('div');
        div.className = 'syserr';
        div.textContent = '会话加载失败，可刷新重试';
        $('stream').appendChild(div);
        return;
      }
      if (String(session.project_id) !== String(S.projectId)) {
        await switchProject(session.project_id);
      }
      openSession(sid, { syncRoute: false });
      // 评审修复：switchProject 会 clearRoute() 抹掉 hash，刷新即丢深链；这里把深链写回。
      // 列表内路径 hash 本就等于该 URL，replaceState 为无害 no-op；跨项目路径则恢复深链。
      history.replaceState(null, '', `#/session/${encodeURIComponent(sid)}`);
    }

    // issue #55 B1：会话不存在/被 popstate 回退时静默回到默认视图（不动项目/会话列表，只清会话详情区）
    function resetSessionView() {
      if (S.es) { S.es.close(); S.es = null; }
      // issue #55 A1：popstate 回退也属「离开会话」，先存草稿（空值则清除）
      saveDraft();
      S.sessionId = null; S.lastSeq = 0; S.activeRunId = null; S.deltaBuf = null; S.toolCards = {};
      S.renderedIds = null; S.esSessionId = null; S.autoFollow = true;
      $('toLatest').style.display = 'none';
      $('stream').innerHTML = '<p class="muted">选择或新建会话</p>';
      $('input').value = '';
      setRunning(false);
      renderSessions();
      clearRoute();
    }

    window.addEventListener('popstate', () => {
      const sid = currentHashSession();
      if (sid) {
        if (String(sid) === String(S.sessionId)) return;
        resolveHashSession(sid); // 评审修复：统一走 detail 端点解析（跨项目/分页外旧会话/失效深链）
      } else if (S.sessionId) resetSessionView();
    });

    function setRunning(on) {
      $('stopBtn').style.display = on ? 'inline-block' : 'none'; // 显式值压过样式表 display:none
      $('sendBtn').disabled = on || !!S.noProject; // issue #42：无项目时发送恒禁用
    }

    $('sendBtn').onclick = send;
    $('input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    });

    async function send() {
      const ctx = S.ctxSeq;
      const sid = S.sessionId;
      const content = $('input').value.trim();
      if (!content || !sid || S.activeRunId) return;
      // issue #55 A7：首次发送属用户手势，此时申请桌面通知权限（浏览器要求 gesture 触发）；不支持/被拒静默降级
      if (typeof Notification !== 'undefined' && Notification.permission === 'default') {
        try { Notification.requestPermission().catch(() => {}); } catch { /* 忽略 */ }
      }
      $('input').value = '';
      try {
        const { message, run } = await api(`/api/sessions/${encodeURIComponent(sid)}/messages`, {
          method: 'POST', body: JSON.stringify({ content, attachments: [] }),
        });
        // 评审修复：API 成功返回后才删草稿，且在守卫判定之前无条件执行（原先 await 前删，失败即丢草稿）
        drafts.delete(sid);
        if (ctx !== S.ctxSeq || S.sessionId !== sid) return;
        addMessage({ ...message, role: 'user' });
        S.activeRunId = run.id;
        setRunning(true);
        loadSessions();
      } catch (e) {
        // 评审修复：草稿按 sid 键，守卫之前写回——发送失败后即使期间切走会话，切回仍可恢复
        drafts.set(sid, content);
        if (ctx !== S.ctxSeq || S.sessionId !== sid) return;
        $('input').value = content; // issue #42：发送失败回填输入，已输入内容不丢
        const div = document.createElement('div');
        div.className = 'syserr';
        // issue #41：LLM 未绑定预检 409 → 友好指引（fde 角色可能无 /admin 权限 → 措辞兜底「联系管理员」）
        div.textContent = e.code === 'llm_not_configured'
          ? '发送失败：该 FDE 未配置 LLM 上游，请到管理台 /admin 配置（无权限请联系管理员）'
          : `发送失败：${e.message}${e.code === 'run_in_progress' ? '（已有进行中任务）' : ''}`;
        $('stream').appendChild(div);
        scrollDown();
      }
    }

    $('stopBtn').onclick = async () => {
      if (!S.sessionId || !S.activeRunId) return;
      try {
        await api(`/api/sessions/${encodeURIComponent(S.sessionId)}/stop`, { method: 'POST', body: '{}' });
        sep('已请求停止…');
      } catch (e) { alert('停止失败：' + e.message); }
    };

    // issue #55 A7：run_end 且页面在后台且已授权 → 桌面通知（标题含会话标题，点击聚焦标签页）；不支持的浏览器静默降级
    function notifyRunEnd(d) {
      try {
        if (typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
        if (!document.hidden) return;
        const sess = S.sessions.find((s) => String(s.id) === String(S.sessionId));
        const title = sess?.title || '未命名会话';
        const reason = d.termination?.reason ?? '';
        const failed = RUN_FAIL_REASONS.has(reason) || !!d.error;
        const body = d.error
          ? `运行失败：${d.error.code} — ${d.error.message}`
          : failed ? `运行结束：${reason}` : '运行完成';
        const n = new Notification(`FDE Station · ${title}`, { body });
        n.onclick = () => { window.focus(); n.close(); };
      } catch { /* 构造通知可能抛错（非安全上下文等）：静默忽略 */ }
    }

    // issue #55 B4：移动端抽屉开关（backdrop 点击关闭见 HTML/CSS）
    $('navToggle').onclick = () => document.body.classList.toggle('drawer-open');
    $('backdrop').onclick = () => document.body.classList.remove('drawer-open');

    boot();
  </script>
</body>
</html>
