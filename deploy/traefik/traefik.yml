# Traefik 静态配置 —— 开发期（P1 walking skeleton）
# 依据：docs/design/deploy-contract.md §4.1 + docs/design/topology.md §6
api: false

# forwardedHeaders 口径（#57 阶段2）：host 网络直连 ⇒ 不信入站 X-Forwarded-*。该口径的正确落点不在
# 入口级（entryPoints.forwardedHeaders 只有 trustedIPs/trustedProxies），而在 forwardAuth 中间件
# 的 `trustForwardHeader: false`——由 portal routes.js 生成（消 station-edge WRN；入口级写它会让 Traefik 拒配置崩退）。
entryPoints:
  web:
    # WP3a：web 入口需对 FDE 容器可达（容器经自身 bridge 网关 IP → 宿主 → Traefik，topology §4-L3/L7），
    # 故开发期绑定 0.0.0.0（127.0.0.1 对容器不可达）。生产入口为 80（对外）与 FDE 白名单网关路径。
    address: ":8090"
    http:
      aliasHeadersStrategy: delete
  websecure:
    address: ":8443"
    http:
      aliasHeadersStrategy: delete
  # issue #450 / feat-261105-01：管理台独立入口（与用户面 web/websecure 端口隔离，配合独立 host admin.<伞域>）。
  # ⚠ 端口写死 9443 —— 本文件里的 `${VAR:default}` **不会被插值**（实测 traefik:v3.7.13 + `--configFile`，
  #   见 .work-orders/450-admin-entry-A1-report.md 的实测输出）：地址原样变成字面量，Traefik 起不来
  #   （`listen tcp: lookup tcp/9443}: unknown port`）。带 `--configFile` 时 `TRAEFIK_ENTRYPOINTS_*_ADDRESS`
  #   这类 env 静态覆盖同样被忽略（实测只看到文件里的 web/websecure）。
  # ⇒ **两处耦合**：改端口要同时改 ① 本行 ② `deploy/.env` 的 `TRAEFIK_ADMIN_PORT`（宿主=容器端口，
  #   station-edge 是 `network_mode: host`，没有端口映射可跟着 env 走）。两处一致性由
  #   `portal/test/deploy-env-defaults.test.js` 机器判据钉住（不是靠人记）。改完必须重启边缘（静态配置只在启动时读）。
  # 绑定 0.0.0.0 的理由同 web（FDE 容器经宿主可达）；来源限制靠路由层的 `ADMIN_IP_ALLOWLIST`（#450 D4）。
  adminsecure:
    address: ":9443"
    http:
      aliasHeadersStrategy: delete

providers:
  file:
    directory: /etc/traefik/dynamic/
    watch: true

log:
  level: INFO
