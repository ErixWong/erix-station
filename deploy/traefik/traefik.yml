# Traefik 静态配置 —— 开发期（P1 walking skeleton）
# 依据：docs/design/deploy-contract.md §4.1 + docs/design/topology.md §6
api: false

entryPoints:
  web:
    address: "127.0.0.1:8090"
    http:
      aliasHeadersStrategy: delete
  websecure:
    address: "127.0.0.1:8443"
    http:
      aliasHeadersStrategy: delete

providers:
  file:
    directory: /etc/traefik/dynamic/
    watch: true

log:
  level: INFO
