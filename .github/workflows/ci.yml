# ============================================================================
# CI —— 质量门禁（PR/main）+ 镜像构建校验（main，按路径过滤，不推送）
# 依据：station issue #235；口径、预算语义、被停额度时的人工兜底见 docs/ops/ci-release.md
#
# 运行器红线：**ubuntu-latest 单一运行器，禁止任何 matrix**
#   （GitHub Free 账号 Linux $0.006/min、Windows $0.01/min、macOS 3-core $0.062/min ≈ 10 倍；
#    matrix 会把分钟数成倍吃掉，而本账号 Actions/Packages 预算 $0 + Stop usage=Yes ⇒ 超额是**停跑**）。
#
# e2e（portal/integration/wp*-e2e.mjs）**故意不进 CI**：需要 docker daemon + 固定 IPAM 池 +
#   泛域名/Tailscale，且 `assertIsolatedEnvironment()` 会硬断言一堆隔离栈 env（ci-release.md §6）。
#
# 依赖注：三个 lockfile 的 resolved 全指 registry.npmjs.org（erix-agent 是公开包）⇒ 不需要 NPM_TOKEN。
# ============================================================================
name: CI

on:
  pull_request: # 只跑门禁，不构建镜像
  push:
    branches: [main] # 门禁 + 三镜像构建校验（--push 关闭，按路径过滤）
  workflow_dispatch: # 额度被静默停跑后手动补跑
    inputs:
      build_images:
        description: '镜像构建校验范围（none = 只跑门禁）'
        type: choice
        required: false
        default: 'none'
        options:
          - none
          - all

# 门禁与「只构建不推送」都不需要写权限（release.yml 才有 packages: write）
permissions:
  contents: read

jobs:
  gate:
    name: 质量门禁（语法 / 根单测 / runner 单测 / 前端 typecheck+test）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 同分支只留最新一次：并发堆分钟数是 Free 账号的主要风险
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    env:
      # 前端 devDependencies（vite/tailwind/vitest）要求 NODE_ENV 不是 production，否则 npm ci 会跳过 devDeps。
      # 镜像构建里才是 NODE_ENV=production（portal/Dockerfile:17），两者不冲突。
      NODE_ENV: development
    outputs:
      build_portal: ${{ steps.paths.outputs.portal }}
      build_fde: ${{ steps.paths.outputs.fde }}
      build_proxy: ${{ steps.paths.outputs.proxy }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 路径过滤要 diff「推入前 ↔ 推入后」，故取全历史（本仓库体量可忽略）
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22' # 对齐 package.json engines（>=22）；本机基线 22.23.2
          # 刻意不开 `cache: npm`：Actions cache 与 Packages 共享 500MB 配额（ci-release.md §4），
          # 三次 npm ci 冷跑共 ~3s，省下的秒数不值配额风险。

      # ---- ① 语法保底：零依赖 node --check 扫全部跟踪的 *.js / *.mjs ----
      # 仓库是 Node ESM 且 package.json 带 "type": "module"，`node --check` 会按 package.json 的
      # type 解析（本机实测 portal/src/config.js 与 portal/integration/lib/fde-image.mjs 均 rc=0）。
      - name: '① 语法保底：node --check 扫全部 *.js / *.mjs'
        run: |
          set -euo pipefail
          n=0; fail=0
          while IFS= read -r -d '' f; do
            n=$((n+1))
            if ! node --check "$f"; then
              echo "::error file=${f}::node --check 语法失败"
              fail=1
            fi
          done < <(git ls-files -z -- '*.js' '*.mjs')
          echo "已 node --check ${n} 个文件（只取 git 跟踪的 *.js / *.mjs；node_modules 天然不在其中）"
          exit $fail

      # ---- ①′ 运行身份诊断（工单 C2）：uid/gid 相关失败今后一眼可判 ----
      # fchown 类断言只在「进程能把属主改成目标 uid」时才成立（非特权进程只能改成自己的 euid/所属组），
      # 而 runner 用户并不恰好是 1000:1000 ⇒ 属主类断言必须跟随进程身份（见 docs/ops/ci-release.md §8）。
      # 不加 continue-on-error / if: always()：这四行本身要跑成功才有意义。
      - name: '①′ 运行身份诊断：id -u / id -g / id / uname -a'
        run: |
          set -euo pipefail
          echo "id -u = $(id -u)"
          echo "id -g = $(id -g)"
          echo "id    = $(id)"
          echo "uname = $(uname -a)"

      # ---- ② 根单测：node --test（1369 项基线 = 1365 通过 + 4 跳过，**`#337` 引擎升级 erix-agent 0.22.0→0.23.0 + 读侧折叠 +28**（升级片：pin + 三处版本 tripwire（含任务单未点名的第三处 `terminationReasons.spec.ts`），产品行为零改动，`src/providers/**` 与 `src/loop/termination.js` 经 `diff -r` 逐字节相同、`termination.reason` 九值逐字未变 ⇒ 只追版本号；折叠片：新 `portal/src/transcript-fold.js`（单一真相源，`foldLedgerRecords` 与 `foldTranscriptRows` 共用同一份 `planFold`）+ 在 `projectSessionMessages` **咽喉点**接线（全站唯一消费点，源码护栏钉住）；新 `portal/test/transcript-fold.test.js` **+20**（15→16 支与上游真件 `node_modules/erix-agent/src/store/message-rows.js` 的 `foldMessageRows` **按文件路径逐字段对拍**（深路径 import 即 tripwire）+ 4 条行为钉：无消息行 ⇒ **返回入参本身（`===` 同一引用）** / 非数组原样返回 / 纯函数（入参零改写、载体是新对象）/ `keyOf` 缺省口径）；新 `portal/test/transcript-fold-wiring.test.js` **+5**（正反两个方向：该折的咽喉点必须折、预写面 `transcript-store.js` 的 `load` 与两个点查探针 + `session-text.js#fetchInputTextByMessageId` 单行点查**不得折**、折叠模块只有一个消费点）；新 `portal/test/session-view-fold.test.js` **+3**（**test-first**：真 0.23 `runToolLoop` 产出 → 按生产列形状（`run_id: null`）装行 → `projectSessionMessages`，修复前 `resultPreview`/`isError` 双 absent ⇒ 卡片退化成 `…`；修复后回来且 `toolCalls.length` **不新增重复**；旧 0.22 账本输出逐字节不变）。**主 agent 亲跑变异 4 条**：① 摘掉咽喉点接线 ⇒ **恰 1 条具名红**（真 0.23 账本那条，`resultPreview` 变回 `undefined`）；② 抹平轮号（`round → 0`）⇒ **6 条红**（分组与载体识别一起失效）；③ 先折再排 ⇒ **8 条全绿** ⇒ 先自证非空操作（双载体输入下本站与上游的载体归属都随输入序变）⇒ 定性「先排序再折」目前不承重，注释是意图声明不是契约；④ 拆掉 `partOf` 合并的 `messages.length === 1` 守卫 ⇒ **19 条全绿 = 真覆盖缺口**（上游 `message-rows.js:137` 有同一守卫但无 fixture 走这条判别支）⇒ **主 agent 自己补一支 fixture**（分片行带两条消息 ⇒ 不当分片、正文照排），补测后重放同一变异 ⇒ **恰 1 条红在新用例上**。`runner/` 与前端零字节 ⇒ runner 321、前端 36 文件/640 不变。；**`#333` 引擎升级 erix-agent 0.20.0→0.22.0 +49**（根 **1292 → 1341**、runner **311 → 321**、前端 **35 文件 / 601** 不变（基线由 #334 从 33/585 推上来，本单前端零改动）；新 helper `portal/test/fake-transcript-rounds.js`（**+1**：`**/test/**/*.js` 会把 helper 算成一项，§8.14 既有口径）= `transcript_rounds` 真库行为仿真（部分唯一索引 + `ON CONFLICT DO NOTHING` ⇒ 零行且 `rowCount 0`；缺 `ON CONFLICT` ⇒ 抛真库 23505 原文；撞键读回**真存的那条 record** 而非空；空表 `MAX(round)` ⇒ null），四处 fake 接上它（`llm` / `message-precheck` / `message-model-precheck` / `session-stop-queued`）——旧写法则 INSERT 一律「出行」、读回一律空 ⇒ **首次预写就伪报冲突**（`existingFingerprint=sha256:0000…`），升级当时 root 10 红；新 `portal/test/transcript-round-dedup-conflict.test.js` **+6**：internal 两条轮写入端点（U5 `putRound` 与引擎轮记录真通路 `putSessionRound`）的**行为级**幂等/冲突判别（只漂顶层 `ts`/`round` ⇒ 幂等且不新增行不覆盖；真换正文/数组换序 ⇒ `409 round_conflict` + 两份指纹 + `differingFields`）——⚠ **这两条方向此前都不红**（把 `samePayload(...)` 改永真或永假，`internal.test.js`+`transcript-store.test.js` 都是 98 通过 0 失败）= 真覆盖缺口，补测后变异才各红：**永真 ⇒ 3 条「该 409」红、永假 ⇒ 3 条「该幂等」红**；新 `portal/test/transcript-payload.test.js` **+15**：本站指纹实现与**上游真件** `erix-agent/src/store/transcript-dedup.js`（不在包 exports 面里，按文件路径 import 当 tripwire）**逐字对拍**：11 组 payload 对 + 循环引用 + 非对象叶子 + 差异字段名 + `recordKey` 三种回退；变异：排除表多塞一个字段 ⇒ **3 条红**；新 `portal/test/session-view-judge-control.test.js` **+6**：0.22 引擎控制文本（`meta.source === 'judge-control'`）不进取数面 + 钉死两条上游口径现状（投影给 **user** 角色的控制消息**另打 `synthetic:true`** ⇒ 界面正文本来就不漏；**assistant** 角色的 `meta.source` 会被投影**抹掉** ⇒ 宿主侧故意不加接不住的守卫）；变异：撤掉宿主守卫 ⇒ **恰 1 红**（诚实结论：它是冗余守卫，只在直接喂 turn 时承重）、改成**整行判** ⇒ **2 红**（含 forced-final 那条，证明「逐条判」是被钉住的）；新 `runner/test/judge-done-advisory.test.js` **+4**：**真 `runToolLoop`** 跑通 `judgeDoneAdvisory`（含 `false` 与「不传 = 上游缺省 false」两条对照组 + 「judge 确实被调到」前置；⚠ 必须走 **2 次**工具调用 —— 拦截门槛是 `count >= judgeIntervalRound` 且计数**从 0 起、不审计那次才 +1**，只走 1 次会退化成 end_turn 那条 judge 支路 ⇒ advisory 恒 0 的假绿形状）；余量为 M2 预写幂等用例与随包契约套件自身增长。；`#114` 部署面默认对齐 **+2**（新文件 `portal/test/deploy-env-defaults.test.js`：compose 里 `ERIX_SESSION_AUTO_TITLE` 的插值默认必须是 `0` + **双向一致性**（把 compose 默认喂进 `loadConfig` 必须等于不喂 env 的代码默认 ⇒「文档说默认关、部署面默认开」这种分叉从此有机器判据；此前那行 `-1` 出自 #88 修订 `125eae9`，#114 改代码默认时漏改 ⇒ 任何 compose 部署上「默认关」从未生效过）。**主 agent 亲跑变异：compose 默认改回 1 ⇒ 2 条全红**（两条判据方向都对））；`#322` 自动改名**接线**修复 **+3**（新文件 `portal/test/session-auto-title-wiring.test.js`：两跳接线的源码级锁（`http.js` ⇒ `setRunState` 必带 `config: ctx.config`；`finishRun` ⇒ `scheduleAutoTitle` 必带 `config`）+ 把真机 A/B 的后果本身钉住（config 缺网关键 ⇒ 请求打到 `http://127.0.0.1:4100/…` = 容器内 ECONNREFUSED 那个地址；带 `llmGatewayAdminUrl` ⇒ 打到它）。**主 agent 亲跑变异 2 条各恰 1 条红在对应那条**：撤掉 `scheduleAutoTitle` 的 `config`（= v0.1.20 缺陷原样复发）⇒ 红在跳②、`http.js` 漏传 ⇒ 红在跳①；真机取证：v0.1.20 上自动改名从来没真的调过模型，A/B 打在 portal 容器里 = `null`/79ms vs `助手能力与交付说明`/1472ms）；含 runner/test 的 321 项；#322 **+1 净**（标题统一到 portal：portal session-title.test.js +10（自动生成/两种降级/清洗同源/title 兼容面/两把结构锁），runner 那份重复实现与其 9 条测试整体删除 ⇒ runner 320→311；主 agent 亲跑变异 3 条全红在具名用例——降级改上抛⇒1红、本地另立 max_tokens/超时⇒1红、runner 那份复活⇒1红；#315 跨路径锁改写为「值仍 512 + 共用同一常量 + runner 那份必须不存在」）；#318+#325 **+5**（写侧上下文窗口硬下限 65536 的边界三件套 + 次序判据「窗口错优先于 1/4 上限错」+ 落库归一为 number 且 PATCH 未带字段不写回；主 agent 亲跑变异 2 条全红在具名用例；`context_window: null` 不作下限判据 = 新建表单「留空」的既有拼写，已核可的收窄），#314 前端 +3（重设按钮只填值不提交 / 无窗口禁用 / 留空=不修改文案；变异：改成自动提交 ⇒ 恰 1 红）；#315 追加 **+19**（新文件 `portal/test/llm-chat.test.js`，注入假 fetch、离线不打真模型：URL 两形态 / **请求体必带 `max_tokens` 且默认 512** / 超时到点必出 502 不悬挂 / 未配置 409 / 上游 5xx 502 / 返回值与错误文本不含明文 key / 以及「`portal/src` 里构造 `chat/completions` 的只有 `llm-chat.js`」这条收口不变量；**主 agent 亲跑变异 3 条**：只拿掉请求体字段 ⇒ 19 红、字段与发出前断言一起拿掉（= #315 病根本体）⇒ 3 红、超时不给终局 ⇒ 1 红）；#315 +1（AI 改名显式发 max_tokens=512 + 跨路径锁；主 agent 2 条变异各恰 1 红），#316+#317 +10（元数据形态口径统一：两侧镜像同一张 TOKEN_FIXTURES，数字串/整值浮点归一成正整数、真小数等判不可得；读侧生效值与心跳下行同源判据；floor(正整数 ctx/4) 收紧；零新错误码；主 agent 亲跑 4 条变异全红在具名用例，并否证「存量真的存在」那句证据——dev 6 条全整数、零实例 ⇒ 属隐患收口），#309 切片 2+2b +28（runner：parseHeartbeatModels 只收正整数/非法形态整键不写/无两键时逐字节兼容，resolveModelMetadata 的 floor(ctx/4) 钳制与边界，新建 runner/test/model-metadata.test.js 跑真 runToolLoop+桩 provider——判据是「桩收到的请求体里 max_tokens 等于生效值」+ model_metadata_missing 出现与否判压缩开关 + 小窗口 ctx=1001/2000/2666 走真闸而 run 不失败；两把源码锁：camelCase 三键只在 #309:engine-model-params 一处、llm-models.js 禁出现引擎公式常量 2000/0.1；主 agent 亲跑 5 条变异全红在具名用例，并审出「1/4 钳制保不住小窗口（ctx=2000⇒−500）」⇒ 改调**包根导出的** computeBudget({contextWindowTokens,maxOutputTokens}) 兜成「整对不传」，公式零复制），#309 切片 1.5 +7（portal：四级回退链逐支钉 + floor 边界 + 窗口不可得不得算出 0/NaN + 一致性「回退值再提交也合法」+ 回退值不落库 + 未配模型开始带两键 + ctx 未配则两键都不出现；主 agent 亲跑 3 条变异全红），#309 切片 1 +12（模型元数据 `max_output_tokens`：读侧回退链三支 / 与 `litellm_params.max_tokens` 绑死双写 / `floor(context_window/4)` 硬上限边界三件套 / 心跳 `models.main` 扩两字段且**只在非 null 时带键** + 按对账后新名取 deployment + 复用对账那一趟 `GET /model/info`；主 agent 亲跑 4 条变异全红在具名用例上，并否证了 worker 写的成因——真机制是引擎 `computeBudget()` 抛 `invalid_budget`，拆解见 ci-release.md §1），#300 中止/失败 run 的部分正文 +17（新文件 portal/test/session-partial-output.test.js：历史端点响应期合成 partial_output——三判据/升序拼接/上限 2000+truncated/whole-run 聚合不占 limit/成本红线用 fake sqlLog 计数钉住；主 agent 变异：早退挪到查询后 ⇒ 恰 1 红，改成追加末尾 ⇒ 全绿并定性为非契约面）；#296 受管改名 +10；#299 引擎升级起 +39（新接随包 toolResultEnvelopeContract 27 条 + 4xx 错误码契约 4 + 三条升级判据 + 时长优先级 4 − 撤闸删 9）；#289 B2 起 +11（新文件 portal/test/message-model-precheck.test.js：发消息 fail-fast 409 llm_model_not_found——失败面干净不占幂等位 / 三种放行含网关不可达 fail-open / 只读 / 必须复用 ctx.llmGateway 单例）；#289 起 +15（新文件 portal/test/llm-reconcile.test.js：心跳模型名对账——先扩 key 白名单后回写 DB 的顺序红线 / TTL 两向 / 三种保守放行 / 端到端反休眠接线用例断言「两跳只打一次网关」= 必须传 ctx.llmGateway 单例）；#292 起 +9（reaper 收敛的重排合成 attempt_killed，全部并入既有 portal/test/internal-attempt-killed.test.js 12→21；同事务/幂等键带 :<attempt>/无 silent_ms 伪装/SSE 必须晚于提交；fake-internal-pool 事务撤销面收紧到 run_queue/runs 改写），#288 起 +45（watchdog 误杀·静默重排·盲目重放四缺陷 A/B/C/D：runner/test/shell-liveness.test.js 新建 +21（心跳/pgid 双层杀/真进程 SIGKILL 前提/启动不变式）、runner/test/replay-policy.test.js 新建 +7（跑真 runToolLoop，判据是「resume 期 executor 有没有收到那个挂起 call_id」，不能用调用次数）、portal/test/internal-attempt-killed.test.js 新建 +12（同事务时序/幂等/无行不推 SSE/COMMIT 失败不留孤儿）、internal-replay-decision.test.js 新建 +3（跨层钉三处集合与文档同源）、session-events-history +2、fake-internal-pool 再度真库化（run_events 按 SQL 文本裁决 23505/23502 + run_events 事务撤销日志），拆解见 ci-release.md §1），#283 起 +22（工具时长恒显 0s：runner/test/tool-duration.test.js 新建 +9（内含「不包 ⇒ 引擎给不出 duration」的上游缺口哨兵，erix-agent #285 落地升版后连适配器一起删），portal/test/internal.test.js +8（U3 回填 tool_calls 两列，含顺序陷阱与幂等不擦写），portal/test/session-view.test.js +5（DTO 在投影后 join durationMs，NULL ⇒ 键不出现），两处 fake 已改为真模拟库约束，拆解见 ci-release.md §1），#285 起 +0（预览告知第 8 条：`portal/test/materializer.test.js` 的锚点断言**并入既有用例**、runner 防漂移用同一条用例扩禁词集 6→8 ⇒ 根与 runner 计数均不变，拆解见 ci-release.md §1），#275 起 +7（`portal/test/preview.test.js`：预览 released 历史行遮蔽活行的回归 + 契约锁 + fake 自证部分唯一索引 + 源码级护栏），#234 起 +24（portal/test/csrf-origin.test.js，跨站写请求防线；含同分支返修：判据 b 只认 same-origin、same-site 必落 Origin 比对，+2 枚回归门），#261 起 +19（runner LLM 三相超时），#257+#258 起 +6，#277-A/A2 起 +17（被停止的 queued run 直接终态 + 出队 + 同事务合成 run_end，新文件 portal/test/session-stop-queued.test.js），#255 后端片起 +29（portal/test/must-change-password.test.js 28 + migrations 0021 断言 1），#280 迁移身份起 +9（migrate-role 6 + 真库 migrate-fresh-db 3，无 TEST_DATABASE_URL 时那 3 条 skip ⇒ 跳过数 1→4），#255 收尾 confirm_password 起 +5（must-change-password 28→33），拆解见 ci-release.md §1）----
      - name: '② 根 npm ci + npm test'
        run: |
          npm ci --no-audit --no-fund
          npm test

      # ---- ③ runner 单测：`node --test` 不带目录参数（AGENTS.md §4 口径：
      #      `node --test runner/test/` 会把目录当模块加载 → Cannot find module，别用）----
      - name: '③ runner npm ci + node --test'
        working-directory: runner
        run: |
          npm ci --no-audit --no-fund
          node --test

      # ---- ④ 前端：显式 NODE_ENV=development（本机 NODE_ENV=production 会跳过 devDeps）----
      - name: '④ 前端 npm ci + typecheck + vitest'
        working-directory: portal/frontend
        run: |
          NODE_ENV=development npm ci --no-audit --no-fund
          npm run typecheck
          npm test

      # ---- ⑤ 按路径判定要构建哪些镜像（只在 push / dispatch=all 时需要）----
      # 口径以**仓库实际构建方式**为准（工单原表 + portal/Dockerfile 的 COPY 面）：
      #   portal 镜像构建上下文 = 仓库根，除 portal/** 与根 package*.json 外，还 COPY 了
      #   docs/data/（portal/Dockerfile:31）与 deploy/migrations/（:34），根 .dockerignore 也参与上下文，
      #   ⇒ 这四类路径变化同样会让镜像内容变化，必须触发构建校验。
      #   FDE 上下文 = runner/（fde-image.mjs:36 `build -t <img> runner/`）；proxy 上下文 = deploy/fde-proxy/。
      - name: '⑤ 按路径判定要构建哪些镜像'
        id: paths
        if: github.event_name == 'push' || github.event.inputs.build_images == 'all'
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          portal=false; fde=false; proxy=false; files=''
          if [ "$EVENT" = 'workflow_dispatch' ]; then
            echo 'workflow_dispatch + build_images=all ⇒ 三个镜像全量构建校验'
            portal=true; fde=true; proxy=true
          elif git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            files="$(git diff --name-only "$BEFORE" "$AFTER" || true)"
            count="$(printf '%s' "$files" | grep -c . || true)"
            echo "路径判定基线：${BEFORE}..${AFTER}，改动文件数 ${count}"
            [ "$count" -gt 0 ] && printf '%s\n' "$files" | sed 's/^/    /' || true
          else
            echo "⚠️ 推入前的 commit（${BEFORE}）不在本地历史（新分支首推 / force push）⇒ 保守起见全量构建"
            portal=true; fde=true; proxy=true
          fi
          if [ -n "$files" ]; then
            printf '%s\n' "$files" | grep -qE '^(\.dockerignore|package\.json|package-lock\.json|portal/|docs/data/|deploy/migrations/)' && portal=true || true
            printf '%s\n' "$files" | grep -qE '^runner/' && fde=true || true
            printf '%s\n' "$files" | grep -qE '^deploy/fde-proxy/' && proxy=true || true
          fi
          {
            echo "portal=$portal"
            echo "fde=$fde"
            echo "proxy=$proxy"
          } >> "$GITHUB_OUTPUT"
          echo "构建判定：portal=$portal fde=$fde proxy=$proxy"

  images:
    name: 镜像构建校验（三镜像，--load 不推送）
    needs: gate
    # PR 一律不构建；push main / dispatch=all 且路径命中才构建（单一 ubuntu-latest，无 matrix）
    if: >-
      github.event_name != 'pull_request' &&
      (needs.gate.outputs.build_portal == 'true' ||
       needs.gate.outputs.build_fde == 'true' ||
       needs.gate.outputs.build_proxy == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: ci-${{ github.ref }}-images
      cancel-in-progress: true
    env:
      # 与 release.yml 同名（全小写硬要求）；CI 只 --load 到本地，不推送、不碰 :local
      IMG_PORTAL: ghcr.io/erixwong/erix-station-portal
      IMG_FDE: ghcr.io/erixwong/erix-station-fde
      IMG_PROXY: ghcr.io/erixwong/erix-station-fde-proxy
    steps:
      - uses: actions/checkout@v4

      # 构建上下文/dockerfile 一律照抄仓库现状，**不传 proxy build args**：
      # runner/Dockerfile:55-74 从 github.com / dl.gitea.io / gitlab.com 直连下载 gh/tea/glab，
      # 本机在墙内要 HTTP_PROXY/HTTPS_PROXY/NO_PROXY + --network=host（fde-image.mjs:26-40），
      # GitHub runner 直连可达；而 build args 参与 Docker 缓存键 ⇒ CI 恒不传，保持稳定。
      - name: '构建校验：station-portal 镜像（context = 仓库根，dockerfile = portal/Dockerfile）'
        if: needs.gate.outputs.build_portal == 'true'
        run: |
          set -euo pipefail
          docker buildx build --load \
            --tag "${IMG_PORTAL}:ci-${GITHUB_SHA::7}" \
            --file portal/Dockerfile \
            .

      - name: '构建校验：FDE 镜像（context = runner/）'
        if: needs.gate.outputs.build_fde == 'true'
        run: |
          set -euo pipefail
          docker buildx build --load \
            --tag "${IMG_FDE}:ci-${GITHUB_SHA::7}" \
            runner/

      - name: '构建校验：fde-proxy 镜像（context = deploy/fde-proxy）'
        if: needs.gate.outputs.build_proxy == 'true'
        run: |
          set -euo pipefail
          docker buildx build --load \
            --tag "${IMG_PROXY}:ci-${GITHUB_SHA::7}" \
            deploy/fde-proxy
