# ============================================================================
# CI —— PR 只跑一条快腿；重活改成手动 / 发版前一次
# 依据：station issue #235；口径与基线见 docs/ops/ci-release.md
#
# 261125 用户裁定：一轮 5–8 分钟的「全量门禁」里，真正抓到过缺陷的只有根单测；
# 真数据库测试 / 前端 typecheck+vitest / 镜像构建校验都不该每个 PR 跑。
#
#   手动             ：① node --check + ② npm ci + npm test（含 runner，约 40–60 秒）
#   手动 build=all   ：三个镜像构建 + build-info tripwire（发版前用）
#
# 261125 再裁定：**连 PR 触发也去掉**——单人仓库里同一套命令本地跑只要 20 秒，
# 没必要每次 push 都占一轮 runner 分钟。门禁靠提交前本地 `npm test`，CI 只在你要的时候跑。
#
# 改成本地手动的：
#   真数据库测试：npm run check:ci-legs（需 TEST_DATABASE_URL，见 docs/testing.md §2.2.1）
#   前端        ：npm run check:frontend（= typecheck + vitest，判定只认退出码）
# ============================================================================
name: CI

on:
  workflow_dispatch: # 只有手动：门禁；build_images=all 时连镜像一起验
    inputs:
      build_images:
        description: '镜像构建校验（none = 只跑门禁）'
        type: choice
        required: false
        default: 'none'
        options:
          - none
          - all

permissions:
  contents: read

jobs:
  gate:
    name: 门禁（语法 + 根单测）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 同分支只留最新一次：并发堆分钟数是 Free 账号的主要风险
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22' # 对齐 package.json engines（>=22）

      # ---- ① 语法保底：零依赖 node --check 扫全部跟踪的 *.js / *.mjs ----
      - name: '① 语法保底：node --check 扫全部 *.js / *.mjs'
        run: |
          set -euo pipefail
          n=0; fail=0
          while IFS= read -r -d '' f; do
            n=$((n+1))
            if ! node --check "$f"; then
              echo "::error file=${f}::node --check 语法失败"
              fail=1
            fi
          done < <(git ls-files -z -- '*.js' '*.mjs')
          echo "已 node --check ${n} 个文件（只取 git 跟踪的 *.js / *.mjs）"
          exit $fail

      # ---- ② 根单测：node --test（根发现规则已包含 runner/test/*.test.js）----
      - name: '② 根 npm ci + npm test'
        run: |
          npm ci --no-audit --no-fund
          npm test

  images:
    name: 镜像构建校验（手动，三镜像 --load 不推送）
    needs: gate
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.build_images == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: ci-${{ github.ref }}-images
      cancel-in-progress: true
    env:
      # 与 release.yml 同名（全小写硬要求）；CI 只 --load 到本地，不推送、不碰 :local
      IMG_PORTAL: ghcr.io/erixwong/erix-station-portal
      IMG_FDE: ghcr.io/erixwong/erix-station-fde
      IMG_PROXY: ghcr.io/erixwong/erix-station-fde-proxy
    steps:
      - uses: actions/checkout@v4

      # build args 的两条口径（#586 现读，别抄旧结论）：
      #   ① 三个**版本** ARG（STATION_VERSION / STATION_REVISION / STATION_BUILD_DATE）portal 与 FDE 都传
      #     ——它们只影响 Dockerfile 末尾那一层，不传就是 build-info.json 里 revision/built_at 恒 unknown。
      #   ② FDE 的**代理** build args CI 恒不传（GitHub runner 直连可达，build args 参与缓存键）。
      - name: '构建校验：station-portal 镜像（context = 仓库根，dockerfile = portal/Dockerfile）'
        run: |
          set -euo pipefail
          docker buildx build --load \
            --tag "${IMG_PORTAL}:ci-${GITHUB_SHA::7}" \
            --build-arg STATION_VERSION="$(node -p "require('./package.json').version")" \
            --build-arg STATION_REVISION="$GITHUB_SHA" \
            --build-arg STATION_BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --file portal/Dockerfile \
            .

      # ---- ④′ portal 镜像的 build-info.json tripwire（v0.1.69 事故：portal 烘的是旧树，无人能发现）----
      - name: '构建校验：station-portal 镜像的 build-info.json（版本/修订真烘进去了吗）'
        run: |
          set -euo pipefail
          docker run --rm --entrypoint cat "${IMG_PORTAL}:ci-${GITHUB_SHA::7}" /app/build-info.json > /tmp/portal-build-info.json
          cat /tmp/portal-build-info.json
          # 四格断言的唯一一份实现在 `scripts/check-build-info.mjs`（CI 与 `portal/test/version-surface.test.js` 共用）
          WANT_VERSION="$(node -p "require('./package.json').version")" WANT_REVISION="$GITHUB_SHA" \
            node scripts/check-build-info.mjs /tmp/portal-build-info.json

      - name: '构建校验：FDE 镜像（context = runner/）'
        run: |
          set -euo pipefail
          docker buildx build --load \
            --tag "${IMG_FDE}:ci-${GITHUB_SHA::7}" \
            --build-arg STATION_VERSION="$(node -p "require('./package.json').version")" \
            --build-arg STATION_REVISION="$GITHUB_SHA" \
            --build-arg STATION_BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            runner/

      - name: '构建校验：FDE 镜像的 build-info.json（版本/修订真烘进去了吗）'
        run: |
          set -euo pipefail
          docker run --rm --entrypoint cat "${IMG_FDE}:ci-${GITHUB_SHA::7}" /opt/erix/build-info.json > /tmp/build-info.json
          cat /tmp/build-info.json
          WANT_VERSION="$(node -p "require('./package.json').version")" WANT_REVISION="$GITHUB_SHA" node -e '
            const fs = require("node:fs");
            const j = JSON.parse(fs.readFileSync("/tmp/build-info.json", "utf8"));
            const bad = [];
            if (j.station_version !== process.env.WANT_VERSION) bad.push("station_version 期望 " + process.env.WANT_VERSION + "，实得 " + j.station_version);
            if (j.revision !== process.env.WANT_REVISION) bad.push("revision 期望 " + process.env.WANT_REVISION + "，实得 " + j.revision);
            if (!j.engine_version || j.engine_version === "unknown") bad.push("engine_version 是 unknown —— 引擎版本没烘进去");
            if (!j.built_at || j.built_at === "unknown") bad.push("built_at 是 unknown —— 没传 STATION_BUILD_DATE");
            if (bad.length) { console.error("::error::build-info.json 不合格：" + bad.join("；")); process.exit(1); }
            console.log("build-info.json OK：" + j.station_version + " / engine " + j.engine_version + " / " + j.revision.slice(0, 7) + " / " + j.built_at);
          '

      - name: '构建校验：fde-proxy 镜像（context = deploy/fde-proxy）'
        run: |
          set -euo pipefail
          docker buildx build --load \
            --tag "${IMG_PROXY}:ci-${GITHUB_SHA::7}" \
            deploy/fde-proxy
