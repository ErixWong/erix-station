# ============================================================================
# erix-station 本地开发栈（P1 walking skeleton）
# 依据：docs/design/deploy-contract.md §2 + docs/env.md §0（开发期参数）
# 服务：station-db / station-docker-proxy / station-portal / station-edge
#   station-litellm 通过 litellm profile opt-in。
# ============================================================================
name: station

networks:
  backend:
    ipam:
      config:
        - subnet: ${BACKEND_SUBNET:-172.32.0.0/24}

services:
  station-db:
    container_name: "${STATION_DB_NAME:-station-db}"
    image: ${POSTGRES_IMAGE:-postgres:16.15}
    restart: unless-stopped
    networks:
      - backend
    # 与其它三服务一致的容器加固：禁提权 + 丢弃全部 capability，仅回加 postgres 初始化所需最小集。
    # 官方入口以 root 启动（chown 数据目录）后用 gosu 降权到 postgres，需：CHOWN / DAC_OVERRIDE / FOWNER / SETGID / SETUID。
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    volumes:
      - ${STATION_DB_DIR:-/docker/station-db}/:/var/lib/postgresql/data
      # 首次初始化（空数据目录时执行一次）：建角色 + 设口令 + baseline + bootstrap + ownership 归正。
      # 角色口令经 600 权限的 deploy/.env 注入（deploy-contract §2.4），不进镜像/仓库。
      - ./db-init/00-init.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
      # 可选 LiteLLM 的专用角色/数据库；仅新建数据目录时运行，已有数据库不受影响。
      - ./db-init/01-litellm.sh:/docker-entrypoint-initdb.d/01-litellm.sh:ro
      - ../docs/data/schema.sql:/init-sql/schema.sql:ro
      - ../docs/data/bootstrap.sql:/init-sql/bootstrap.sql:ro
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-station}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-dev-only}
      POSTGRES_DB: ${POSTGRES_DB:-station}
      # 迁移/运行时角色口令（init 脚本读取后 ALTER ROLE ... PASSWORD）
      PLATFORM_DB_PASSWORD: ${PLATFORM_DB_PASSWORD:-change-me-dev-only}
      PORTAL_DB_PASSWORD: ${PORTAL_DB_PASSWORD:-change-me-dev-only}
      LITELLM_DB_PASSWORD: ${LITELLM_DB_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # /var/run/docker.sock 只挂到这里；portal 经 tcp://station-docker-proxy:2375 访问（deploy-contract §5）。
  # 自研零依赖 admission proxy：方法+路径白名单（12 条契约路径）+ POST /containers/create 策略校验（§5 B6），
  # 替换 tecnativa/docker-socket-proxy（其 POST=1 是全局方法门，无路径级 POST 白名单）。
  station-docker-proxy:
    container_name: "${STATION_DOCKER_PROXY_NAME:-station-docker-proxy}"
    build:
      context: ./fde-proxy
      dockerfile: Dockerfile
    # 生产 pin 不可变引用（image@sha256:<digest> 或 sha256:<imageId>，issue #27）；dev 默认 local。
    image: ${STATION_DOCKER_PROXY_IMAGE:-erix-station/fde-proxy:local}
    restart: unless-stopped
    networks:
      - backend
    read_only: true
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    # 运行身份：uid 0（root）以 owner 权限读/写 docker.sock（host 上 root:docker 660）；gid 1000（erix 组）
    # 以 group 权限穿越 2770 用户空间目录——cap_drop ALL 下 root 无 DAC_OVERRIDE，只能靠组权限做
    # realpath 校验 bind source（防 symlink 逃逸），否则 2770 目录（other=---）会 EACCES。
    user: "0:1000"
    tmpfs:
      - /tmp
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # P3：ro 挂载用户空间根，供 proxy realpath 校验 bind source（防 symlink 逃逸）。
      - ${ERIX_USERSPACE_ROOT_HOST:-/srv/erix/users}:/srv/erix/users:ro
    environment:
      PORT: "2375"
      SOCKET_PATH: /var/run/docker.sock
      # bind source 根：USERSPACE_ROOT = 容器内路径（realpath 校验用）；USERSPACE_ROOT_HOST = 宿主路径（路径换算）。
      USERSPACE_ROOT: /srv/erix/users
      USERSPACE_ROOT_HOST: ${ERIX_USERSPACE_ROOT_HOST:-/srv/erix/users}
      # 镜像白名单：与 FDE_IMAGE 同源 env（全串精确匹配；生产 pin 形态 ① image@sha256:… 或 ② sha256:<imageId>，issue #27）
      IMAGE_ALLOWLIST: ${FDE_IMAGE:-traefik/whoami}
      # 允许的容器 Memory 上限（字节；0 = 不限）
      MAX_MEMORY: ${FDE_MEMORY_LIMIT_MAX:-0}
      # 允许的容器 PidsLimit 上限（0 = 不限）
      MAX_PIDS: ${FDE_PIDS_LIMIT_MAX:-0}
      # 允许的容器 User 值（逗号分隔；默认 1001:1000）
      ALLOWED_USERS: ${FDE_ALLOWED_USERS:-1001:1000}
      # 允许的 network create subnet 池（逗号分隔 CIDR）
      IPAM_POOLS: ${FDE_IPAM_POOLS:-10.200.0.0/16,10.201.0.0/16}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:2375/_ping').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  station-portal:
    container_name: "${STATION_PORTAL_NAME:-station-portal}"
    build:
      context: ..
      dockerfile: portal/Dockerfile
    image: ${STATION_PORTAL_IMAGE:-erix-station/portal:local}
    restart: unless-stopped
    networks:
      - backend
    depends_on:
      station-db:
        condition: service_healthy
      station-docker-proxy:
        condition: service_started
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    cap_add:
      # materializer 以 root 写平台文件（root:root 0644/0444）+ chown 工作区（1000:1000）：需 CHOWN/DAC_OVERRIDE/FOWNER/SETGID/SETUID（deploy-contract §1/§2.2 注）。
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    ports:
      # 仅回环发布（deploy-contract §2.2）；容器内固定 8080，宿主端口见 PORTAL_HOST_PORT
      - "127.0.0.1:${PORTAL_HOST_PORT:-18080}:8080"
    volumes:
      # 用户空间（D-6 直写宿主 bind mount，RW 同路径，user-space §2.2）；宿主路径可注入（开发期隔离用临时目录）。
      - ${ERIX_USERSPACE_ROOT_HOST:-/srv/erix/users}:/srv/erix/users
      # Traefik 动态配置（reconciler 单一写方，deploy-contract §4.2）；与 Traefik 侧共享宿主目录。
      - ${TRAEFIK_DYNAMIC_DIR_HOST:-./traefik/dynamic}:/etc/traefik/dynamic
      # issue #64 R1：run 终态产物（worktree bundle tar.gz）持久卷（deploy-contract §2.2 ④）。
      - ${ERIX_ARTIFACTS_ROOT_HOST:-/srv/erix/artifacts}:/srv/erix/artifacts
    environment:
      PORT: "8080"
      # 运行时身份 station_portal（最小 DML，deploy-contract §2.4/§3）
      DATABASE_URL: postgres://${PORTAL_DB_USER:-station_portal}:${PORTAL_DB_PASSWORD:-change-me-dev-only}@station-db:5432/${POSTGRES_DB:-station}
      # 迁移身份 station_platform（DDL；migrate runner 读取，见 deploy-contract §3）
      MIGRATE_DATABASE_URL: postgres://${PLATFORM_DB_USER:-station_platform}:${PLATFORM_DB_PASSWORD:-change-me-dev-only}@station-db:5432/${POSTGRES_DB:-station}
      # bootstrap 超级用户（schema.sql/bootstrap.sql 的角色/授权/ownership，仅 bootstrap 步骤用）
      BOOTSTRAP_DATABASE_URL: postgres://${POSTGRES_USER:-station}:${POSTGRES_PASSWORD:-change-me-dev-only}@station-db:5432/${POSTGRES_DB:-station}
      # portal 经自研 admission proxy 访问 Docker API（不直挂 /var/run/docker.sock）
      DOCKER_HOST: tcp://station-docker-proxy:2375
      COOKIE_PROFILE: ${COOKIE_PROFILE:-dev-http}
      BASE_DOMAIN: ${BASE_DOMAIN:-localhost}
      # F9：栈所有权标签——reconcile 孤儿清扫只清 station.stack=<stackId> 的本栈 FDE 容器/网络，
      # 防并行栈（如 wp3b-e2e 隔离栈，STATION_STACK_ID=station-e2e-43）互删对方 FDE。缺省 default。
      STATION_STACK_ID: ${STATION_STACK_ID:-default}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-604800}
      # ---- WP2a：materializer + 路由 reconciler ----
      ERIX_USERSPACE_ROOT: /srv/erix/users
      # F3：bind source 用宿主路径（与容器内 ERIX_USERSPACE_ROOT 解耦）
      ERIX_USERSPACE_ROOT_HOST: ${ERIX_USERSPACE_ROOT_HOST:-/srv/erix/users}
      # offboarding 完成后的 workspace 保留天数；0 禁用自动清理。
      ERIX_WORKSPACE_RETENTION_DAYS: ${ERIX_WORKSPACE_RETENTION_DAYS:-30}
      TRAEFIK_DYNAMIC_DIR: /etc/traefik/dynamic
      TRAEFIK_DYNAMIC_FILE: routes.yml
      PORTAL_HOST: ${PORTAL_HOST:-station.localhost}
      PORTAL_INTERNAL_HOSTS: ${PORTAL_INTERNAL_HOSTS:-}
      PORTAL_BACKEND_URL: http://127.0.0.1:${PORTAL_HOST_PORT:-18080}
      # issue #64 R1：run 终态产物持久卷（容器内路径；宿主路径经 ERIX_ARTIFACTS_ROOT_HOST 注入）。
      ERIX_ARTIFACTS_ROOT: /srv/erix/artifacts
      TRAEFIK_ENTRYPOINT: web
      # 容器经 Traefik 访问 portal/LLM 的公共入口 base URL（scheme://host[:port]）。dev http+高端口 / prod https+443。
      # 由 ERIX_STATION_BASE_URL（agentd）与 config.json endpoint（worker provider）使用。
      TRAEFIK_WEB_PORT: ${TRAEFIK_WEB_PORT:-8090}
      TRAEFIK_WEBSECURE_PORT: ${TRAEFIK_WEBSECURE_PORT:-8443}
      # issue #84 P5：FDE agentd/worker 可调参数（portal → provisioner → FDE 容器 env 下发；改值重建容器即可）。
      ERIX_MAX_ROUNDS: ${ERIX_MAX_ROUNDS:-16}
      ERIX_AGENTD_CAPACITY: ${ERIX_AGENTD_CAPACITY:-2}
      ERIX_ARTIFACT_MAX_BYTES: ${ERIX_ARTIFACT_MAX_BYTES:-104857600}
      ERIX_ARTIFACT_CAPTURE_BUDGET_MS: ${ERIX_ARTIFACT_CAPTURE_BUDGET_MS:-60000}
      ERIX_SHELL_TIMEOUT_MS: ${ERIX_SHELL_TIMEOUT_MS:-60000}
      ERIX_SHELL_MAX_TIMEOUT_MS: ${ERIX_SHELL_MAX_TIMEOUT_MS:-600000}
      ERIX_SHELL_OUTPUT_MAX_BYTES: ${ERIX_SHELL_OUTPUT_MAX_BYTES:-32768}
      # issue #88 修订：会话标题生成移到 worker 侧（随 run_finished 上报，portal 落库）；
      # 开关同名下发 FDE 容器 env（'0' 关），portal 侧同 env 控制落库评估。下发光纤同 issue #84 P5。
      ERIX_SESSION_AUTO_TITLE: ${ERIX_SESSION_AUTO_TITLE:-1}
      PORTAL_PUBLIC_BASE_URL: ${PORTAL_PUBLIC_BASE_URL:-}
      LLM_PUBLIC_BASE_URL: ${LLM_PUBLIC_BASE_URL:-}
      LLM_HOST: llm.${BASE_DOMAIN:-localhost}
      # issue #117 phase 2：portal 已切到 LiteLLM 数据面。Traefik 跑 host 网络，故此处是宿主回环
      # 地址；LiteLLM 默认发布在 4100，可通过 LITELLM_HOST_PORT 为隔离栈指定独立端口。
      LLM_GATEWAY_HOST: ${LLM_GATEWAY_HOST:-http://127.0.0.1:4100}
      # issue #117：预留 gateway admin 配置供后续阶段使用；当前 portal 不调用这些配置。
      LLM_GATEWAY_MODE: ${LLM_GATEWAY_MODE:-self}
      LLM_GATEWAY_ADMIN_URL: ${LLM_GATEWAY_ADMIN_URL:-http://station-litellm:4000}
      LLM_GATEWAY_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
      PORT_QUOTA: ${PORT_QUOTA:-40}
      FDE_POOL: ${FDE_POOL:-default}
      IPAM_RESERVED_SUBNETS: ${IPAM_RESERVED_SUBNETS:-}
      FDE_USER_UID: ${FDE_USER_UID:-1000}
      FDE_USER_GID: ${FDE_USER_GID:-1000}
      # ---- WP2b：FDE provisioning + preview ticket ----
      FDE_IMAGE: ${FDE_IMAGE:-traefik/whoami}
      # F12/F14：FDE_DEV_MODE=1 显式开发模式（默认未设即开发）；生产设 0 或 NODE_ENV=production
      FDE_DEV_MODE: ${FDE_DEV_MODE:-1}
      # F5：开发期 whoami 镜像不满足「root 启动→drop 1001」契约时的 --user 兜底（⚠️ dev 偏差）；生产留空由镜像 entrypoint 降权。
      # 用单斜线默认（`-` 非 `:-`）：显式空值（真实 runner 镜像不用 --user）不会被默认值覆盖。
      FDE_DEV_USER: ${FDE_DEV_USER-1001:1000}
      FDE_CMD: ${FDE_CMD:-["-port","4000"]}
      FDE_AGENT_VERSION: ${FDE_AGENT_VERSION:-dev}
      # FDE 内存限额（issue #27 已决 2026-09-18：默认 4g——B 档镜像下 dotnet build/chromium 峰值需要；`0` 不限）
      FDE_MEMORY_LIMIT: ${FDE_MEMORY_LIMIT:-4g}
      FDE_AGENTD_UID: ${FDE_AGENTD_UID:-1001}
      FDE_WORKER_UID: ${FDE_WORKER_UID:-1002}
      # 预览 session 派生密钥（HMAC-SHA256，portal.md §2.7）；生产必须显式改掉此 dev 占位
      SESSION_SIGNING_KEY: ${SESSION_SIGNING_KEY:-erix-station-dev-signing-key-change-me}
      PREVIEW_TICKET_TTL_SECONDS: ${PREVIEW_TICKET_TTL_SECONDS:-60}
      PREVIEW_SESSION_TTL_SECONDS: ${PREVIEW_SESSION_TTL_SECONDS:-900}
      # P1：baseline(schema.sql) + bootstrap.sql 由 station-db 首次初始化（db-init/00-init.sh，超级用户）
      # 完成；增量迁移（deploy/migrations/0001-idempotency-keys.sql 提供幂等台账 idempotency_keys，
      # portal.md §1.4）此前需人工补跑 → 本栈**显式启用启动迁移**：portal 在**监听端口前**以
      # station_platform（MIGRATE_DATABASE_URL）应用 baseline 之后的全部增量，起栈即自洽
      # （deploy-contract §3.1；G1 裁决：P1 单实例平台自动迁移安全，避免「部署后忘跑迁移 → 表缺失 500」）。
      # ⚠️ 多实例部署**必须**外部执行迁移并禁用启动迁移（并发 DDL 无收益，迁移是发布动作）：
      #   先 `MIGRATE_ON_START=0 node portal/src/cli.js migrate`（单次，station_platform），再以本值为 0 起
      #   各实例（compose override 文件覆盖本行，见 deploy-contract §3.1）。
      MIGRATE_ON_START: "1"
    healthcheck:
      test: ["CMD", "node", "portal/src/cli.js", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # LiteLLM is the sole LLM gateway for both admin and data-plane traffic.
  station-litellm:
    container_name: "${STATION_LITELLM_NAME:-station-litellm}"
    image: ghcr.io/berriai/litellm:v1.103.2@sha256:f63fb81b831b170ec16851e23c36ac5bf52ef106b271406429524a2ed730bbfd
    profiles:
      - litellm
    restart: unless-stopped
    networks:
      - backend
    depends_on:
      station-db:
        condition: service_healthy
    user: "65532:65532"
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:mode=1777,uid=65532,gid=65532
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    environment:
      HOME: /home/nonroot
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
      DATABASE_URL: postgresql://${LITELLM_DB_USER:-litellm}:${LITELLM_DB_PASSWORD:-}@station-db:5432/litellm
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:-}
      LITELLM_MODE: PRODUCTION
      LITELLM_NON_ROOT: "true"
    command:
      - --config
      - /app/config.yaml
      - --port
      - "4000"
    ports:
      # Host network Traefik reaches the data plane through this loopback-only publish.
      - "127.0.0.1:${LITELLM_HOST_PORT:-4100}:4000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/readiness', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

  station-edge:
    container_name: "${STATION_EDGE_NAME:-station-edge}"
    image: ${TRAEFIK_IMAGE:-traefik:v3.7.13}
    restart: unless-stopped
    network_mode: host
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    command:
      - --configFile=/etc/traefik/traefik.yml
      # F8 注：入口端口**不写 CLI 覆盖**——Traefik v3 带 --configFile 时静态文件里已定义的
      # entryPoints 会压过 CLI 覆盖（实测 file + --entrypoints.web.address=:19090 仍绑 :8090、
      # 与共享 edge 抢端口 EADDRINUSE）。隔离栈改经 TRAEFIK_STATIC_HOST 整体替换静态配置文件
      #（见下条 volume 与 wp3b-e2e 的生成逻辑）。
    volumes:
      # 静态配置可整体替换（F8 并行隔离：wp3b-e2e 生成仅改入口端口的专用 traefik.yml 注入）；
      # 缺省 = 共享同一份文件，渲染不变、不 recreate。
      - ${TRAEFIK_STATIC_HOST:-./traefik/traefik.yml}:/etc/traefik/traefik.yml:ro
      # 动态配置目录与 portal（reconciler）共享宿主目录；Traefik 侧只读（deploy-contract §4.2）。
      - ${TRAEFIK_DYNAMIC_DIR_HOST:-./traefik/dynamic}:/etc/traefik/dynamic/:ro
    # 开发期 http，无 acme.json / 证书；部署期证书与 logs 见 deploy-contract §2.2/§4.3
    # 注：开发期绑定 8090/8443（>1024）无需 NET_BIND_SERVICE；生产 80/443 需 cap_add: [NET_BIND_SERVICE]
