# ============================================================================
# erix-station 本地开发栈（P1 walking skeleton）
# 依据：docs/design/deploy-contract.md §2 + docs/env.md §0（开发期参数）
# 服务：station-db / station-docker-socket-proxy / station-portal / station-edge
#   （FDE 容器、LLM 网关、materializer、路由 reconciler 归后续轮次）
# ============================================================================
name: station

networks:
  backend:
    ipam:
      config:
        - subnet: ${BACKEND_SUBNET:-172.32.0.0/24}

services:
  station-db:
    container_name: station-db
    image: ${POSTGRES_IMAGE:-postgres:16.15}
    restart: unless-stopped
    networks:
      - backend
    # 与其它三服务一致的容器加固：禁提权 + 丢弃全部 capability，仅回加 postgres 初始化所需最小集。
    # 官方入口以 root 启动（chown 数据目录）后用 gosu 降权到 postgres，需：CHOWN / DAC_OVERRIDE / FOWNER / SETGID / SETUID。
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    volumes:
      - /docker/station-db/:/var/lib/postgresql/data
      # 首次初始化（空数据目录时执行一次）：建角色 + 设口令 + baseline + bootstrap + ownership 归正。
      # 角色口令经 600 权限的 deploy/.env 注入（deploy-contract §2.4），不进镜像/仓库。
      - ./db-init/00-init.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
      - ../docs/data/schema.sql:/init-sql/schema.sql:ro
      - ../docs/data/bootstrap.sql:/init-sql/bootstrap.sql:ro
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-station}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-dev-only}
      POSTGRES_DB: ${POSTGRES_DB:-station}
      # 迁移/运行时角色口令（init 脚本读取后 ALTER ROLE ... PASSWORD）
      PLATFORM_DB_PASSWORD: ${PLATFORM_DB_PASSWORD:-change-me-dev-only}
      PORTAL_DB_PASSWORD: ${PORTAL_DB_PASSWORD:-change-me-dev-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # /var/run/docker.sock 只挂到这里；portal 经 tcp://station-docker-socket-proxy:2375 访问（deploy-contract §5）。
  # 白名单：CONTAINERS=1、NETWORKS=1，其余 0；POST=0 → 本阶段 portal 只读 Docker API（创建容器归 WP2）。
  station-docker-socket-proxy:
    container_name: station-docker-socket-proxy
    image: ${SOCKET_PROXY_IMAGE:-tecnativa/docker-socket-proxy:v0.5.0}
    restart: unless-stopped
    networks:
      - backend
    read_only: true
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    # haproxy 需要写 pidfile(/run) 与临时配置(/tmp) 与 server-state(/var/lib/haproxy)
    tmpfs:
      - /tmp
      - /run
      - /var/lib/haproxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CONTAINERS: "1"
      NETWORKS: "1"
      POST: "0"
      EVENTS: "0"
      VOLUMES: "0"
      IMAGES: "0"
      EXEC: "0"
      SYSTEM: "0"
      AUTH: "0"
      SECRETS: "0"
      BUILD: "0"
      COMMIT: "0"
      PLUGINS: "0"
      SWARM: "0"
      INFO: "0"
      # 只读健康/版本端点（readiness 与验收用），镜像默认即为 1，此处显式声明
      PING: "1"
      VERSION: "1"
    # 其余变量（CONFIGS/DISTRIBUTION/GRPC/NODES/SERVICES/SESSION/TASKS/ALLOW_*）沿用镜像默认 0

  station-portal:
    container_name: station-portal
    build:
      context: ..
      dockerfile: portal/Dockerfile
    image: erix-station/portal:local
    restart: unless-stopped
    networks:
      - backend
    depends_on:
      station-db:
        condition: service_healthy
      station-docker-socket-proxy:
        condition: service_started
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    cap_add:
      # materializer 以 root 写平台文件（root:root 0644/0444）+ chown 工作区（1000:1000）：需 CHOWN/DAC_OVERRIDE/FOWNER/SETGID/SETUID（deploy-contract §1/§2.2 注）。
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    ports:
      # 仅回环发布（deploy-contract §2.2）；容器内固定 8080，宿主端口见 PORTAL_HOST_PORT
      - "127.0.0.1:${PORTAL_HOST_PORT:-18080}:8080"
    volumes:
      # 用户空间（D-6 直写宿主 bind mount，RW 同路径，user-space §2.2）；宿主路径可注入（开发期隔离用临时目录）。
      - ${ERIX_USERSPACE_ROOT_HOST:-/srv/erix/users}:/srv/erix/users
      # Traefik 动态配置（reconciler 单一写方，deploy-contract §4.2）；与 Traefik 侧共享宿主目录。
      - ${TRAEFIK_DYNAMIC_DIR_HOST:-./traefik/dynamic}:/etc/traefik/dynamic
    environment:
      PORT: "8080"
      # 运行时身份 station_portal（最小 DML，deploy-contract §2.4/§3）
      DATABASE_URL: postgres://${PORTAL_DB_USER:-station_portal}:${PORTAL_DB_PASSWORD:-change-me-dev-only}@station-db:5432/${POSTGRES_DB:-station}
      # 迁移身份 station_platform（DDL；migrate runner 读取，见 deploy-contract §3）
      MIGRATE_DATABASE_URL: postgres://${PLATFORM_DB_USER:-station_platform}:${PLATFORM_DB_PASSWORD:-change-me-dev-only}@station-db:5432/${POSTGRES_DB:-station}
      # bootstrap 超级用户（schema.sql/bootstrap.sql 的角色/授权/ownership，仅 bootstrap 步骤用）
      BOOTSTRAP_DATABASE_URL: postgres://${POSTGRES_USER:-station}:${POSTGRES_PASSWORD:-change-me-dev-only}@station-db:5432/${POSTGRES_DB:-station}
      # portal 经 socket-proxy 访问 Docker API（不直挂 /var/run/docker.sock）
      DOCKER_HOST: tcp://station-docker-socket-proxy:2375
      COOKIE_PROFILE: ${COOKIE_PROFILE:-dev-http}
      BASE_DOMAIN: ${BASE_DOMAIN:-localhost}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-604800}
      # ---- WP2a：materializer + 路由 reconciler ----
      ERIX_USERSPACE_ROOT: /srv/erix/users
      TRAEFIK_DYNAMIC_DIR: /etc/traefik/dynamic
      TRAEFIK_DYNAMIC_FILE: routes.yml
      PORTAL_HOST: station.${BASE_DOMAIN:-localhost}
      PORTAL_BACKEND_URL: http://127.0.0.1:${PORTAL_HOST_PORT:-18080}
      TRAEFIK_ENTRYPOINT: web
      LLM_HOST: llm.${BASE_DOMAIN:-localhost}
      PORT_QUOTA: ${PORT_QUOTA:-40}
      FDE_POOL: ${FDE_POOL:-default}
      IPAM_RESERVED_SUBNETS: ${IPAM_RESERVED_SUBNETS:-}
      FDE_USER_UID: ${FDE_USER_UID:-1000}
      FDE_USER_GID: ${FDE_USER_GID:-1000}
      # P1：baseline(schema.sql) + bootstrap.sql 由 station-db 首次初始化（db-init/00-init.sh，超级用户）
      # 完成；deploy/migrations/*.sql 尚无增量。运行时以 station_portal 启动，不重复跑 superuser-only
      # 的 bootstrap。出现首个增量迁移时，以 station_platform（MIGRATE_DATABASE_URL）跑
      # `node portal/src/cli.js migrate`，或让 migrate runner 消费 MIGRATE_DATABASE_URL 后置回 1。
      MIGRATE_ON_START: "0"
    healthcheck:
      test: ["CMD", "node", "portal/src/cli.js", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  station-edge:
    container_name: station-edge
    image: ${TRAEFIK_IMAGE:-traefik:v3.7.13}
    restart: unless-stopped
    network_mode: host
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    command:
      - --configFile=/etc/traefik/traefik.yml
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      # 动态配置目录与 portal（reconciler）共享宿主目录；Traefik 侧只读（deploy-contract §4.2）。
      - ${TRAEFIK_DYNAMIC_DIR_HOST:-./traefik/dynamic}:/etc/traefik/dynamic/:ro
    # 开发期 http，无 acme.json / 证书；部署期证书与 logs 见 deploy-contract §2.2/§4.3
    # 注：开发期绑定 8090/8443（>1024）无需 NET_BIND_SERVICE；生产 80/443 需 cap_add: [NET_BIND_SERVICE]
