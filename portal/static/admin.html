<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FDE Station · 管理台</title>
  <!-- issue #42：内联 SVG favicon（原 404） -->
  <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><rect width="16" height="16" rx="3" fill="%230a7"/><text x="8" y="12" font-size="10" text-anchor="middle" fill="%23fff" font-family="sans-serif">F</text></svg>'>
  <!-- issue #59：Bootstrap 5.3 本地 vendor（见 /vendor/README.md） -->
  <link rel="stylesheet" href="/vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="/vendor/bootstrap-icons/font/bootstrap-icons.min.css">
  <style>
    /* 主题变量：品牌色 --brand: #0a7 映射到 Bootstrap 主色体系 */
    :root {
      --brand: #0a7;
      --bd: var(--bs-border-color);
      --muted: var(--bs-secondary-color);
      --bs-primary: #0a7;
      --bs-primary-rgb: 0, 170, 119;
      --bs-link-color: #0a7;
      --bs-link-hover-color: #086;
    }
    /* Bootstrap 5.3 的 .btn-primary 颜色为字面量（不读 --bs-primary），这里做品牌色覆盖 */
    .btn-primary {
      --bs-btn-bg: #0a7; --bs-btn-border-color: #0a7;
      --bs-btn-hover-bg: #086; --bs-btn-hover-border-color: #086;
      --bs-btn-active-bg: #075; --bs-btn-active-border-color: #075;
      --bs-btn-disabled-bg: #0a7; --bs-btn-disabled-border-color: #0a7;
      --bs-btn-focus-shadow-rgb: 0, 170, 119;
    }
    .muted { color: var(--muted); font-size: .8rem; }
    .syserr { color: var(--bs-danger); font-size: .85rem; margin: .4rem 0; }
    .okmsg { color: var(--bs-success); font-size: .85rem; margin: .4rem 0; }
    /* 供应商/用户卡片头（卡片本体用 Bootstrap .card） */
    .card .head { display: flex; gap: .8rem; align-items: center; flex-wrap: wrap; }
    .card .head .name { font-weight: 600; }
    .card .head .url { color: var(--muted); font-size: .82rem; word-break: break-all; }
    .spacer { flex: 1; }
    .row-head { cursor: pointer; }
    .row-head:hover { background: var(--bs-success-bg-subtle); }
    .detail { margin-top: .6rem; border-top: 1px dashed var(--bd); padding-top: .6rem; }
    /* 状态徽章（沿用页面内 class 钩子 badge on/off/type） */
    .badge { border: 1px solid transparent; font-weight: 500; }
    .badge.on { color: var(--bs-success); border-color: var(--bs-success); background: var(--bs-success-bg-subtle); }
    .badge.off { color: var(--bs-secondary); border-color: var(--bs-secondary-border-subtle); background: var(--bs-secondary-bg-subtle); }
    .badge.type { color: var(--bs-info); border-color: var(--bs-info); background: var(--bs-info-bg-subtle); }
    /* 活跃 run 告警盒 + 一次性 TOTP 提示盒 */
    .warnbox { border: 1px solid var(--bs-warning); background: var(--bs-warning-bg-subtle); color: var(--bs-warning-text-emphasis); border-radius: 8px; padding: .5rem .8rem; font-size: .83rem; margin: .5rem 0; }
    .totpbox { border: 1px solid var(--brand); background: var(--bs-success-bg-subtle); border-radius: 8px; padding: .6rem .8rem; margin: .5rem 0; font-size: .85rem; }
    .totpbox .qr { display: block; width: 12rem; height: 12rem; margin: .5rem 0; image-rendering: pixelated; }
    .totpbox code { word-break: break-all; user-select: all; }
    /* LLM 配置 grid 表单（auto-fit 多列，表单控件本身用 Bootstrap form-control/form-select） */
    .llmform { display: grid; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); gap: .5rem; margin-top: .5rem; }
    .llmform > label { display: flex; flex-direction: column; gap: .15rem; font-size: .75rem; color: var(--muted); }
  </style>
</head>
<body class="bg-body-tertiary">
  <header class="d-flex align-items-center gap-3 border-bottom bg-white px-3 py-2">
    <h1 class="h5 mb-0">FDE Station · 管理台</h1>
    <span class="who flex-fill text-muted small" id="who"></span>
    <button type="button" id="logout" class="btn btn-outline-secondary btn-sm"><i class="bi bi-box-arrow-right"></i> 登出</button>
    <a href="/" class="small">← 返回工作台</a>
  </header>
  <main class="container py-3 d-flex flex-column gap-4">
    <section class="card" id="llmSection">
      <div class="card-body">
        <h2 class="h5 card-title">LLM 供应商</h2>
        <div id="llmErr"></div>
        <div id="providerList"><p class="muted">加载中…</p></div>
        <form class="row g-2 align-items-end mt-2" id="addProviderForm">
          <div class="col-md-auto">
            <label class="d-flex flex-column gap-1 small text-muted">供应商名<input name="name" required placeholder="openai" class="form-control form-control-sm"></label>
          </div>
          <div class="col-md-auto">
            <label class="d-flex flex-column gap-1 small text-muted">Base URL<input name="base_url" required placeholder="https://api.openai.com/v1" class="form-control form-control-sm"></label>
          </div>
          <div class="col-md-auto">
            <button class="btn btn-primary" type="submit">＋ 新增供应商</button>
          </div>
        </form>
      </div>
    </section>

    <section class="card" id="fdeSection">
      <div class="card-body">
        <h2 class="h5 card-title">FDE 管理</h2>
        <div id="fdeErr"></div>
        <div id="totpOnce"></div>
        <div id="userList"><p class="muted">加载中…</p></div>
        <h2 class="h5 mt-4">新增 FDE 用户</h2>
        <form class="row g-2 align-items-end mt-2" id="addUserForm">
          <div class="col-md-auto">
            <label class="d-flex flex-column gap-1 small text-muted">登录名<input name="login" required autocomplete="off" class="form-control form-control-sm"></label>
          </div>
          <div class="col-md-auto">
            <label class="d-flex flex-column gap-1 small text-muted">显示名<input name="display_name" autocomplete="off" class="form-control form-control-sm"></label>
          </div>
          <div class="col-md-auto">
            <label class="d-flex flex-column gap-1 small text-muted">口令<input name="password" type="password" required autocomplete="new-password" class="form-control form-control-sm"></label>
          </div>
          <div class="col-md-auto">
            <label class="d-flex flex-column gap-1 small text-muted">fde_name（可空）<input name="fde_name" placeholder="alice" autocomplete="off" class="form-control form-control-sm"></label>
          </div>
          <div class="col-md-auto">
            <button class="btn btn-primary" type="submit">＋ 创建用户</button>
          </div>
        </form>
      </div>
    </section>
  </main>
  <script src="/qrcode.js"></script>
  <script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script>
    'use strict';
    const $ = (id) => document.getElementById(id);
    // 与 index.html 同款的 HTML 转义：所有动态值进 DOM 前必须经 esc() 或 textContent。
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    const S = { user: null, providers: [], users: [], expanded: new Set(), userExpanded: new Set() };

    async function api(path, opts = {}) {
      const r = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...opts });
      if (r.status === 204) return null;
      const body = await r.json().catch(() => ({}));
      if (!r.ok) throw Object.assign(new Error(body.error?.message ?? ('HTTP ' + r.status)), { code: body.error?.code, status: r.status });
      return body;
    }

    function showErr(elId, err) {
      $(elId).innerHTML = '';
      if (!err) return;
      const div = document.createElement('div');
      div.className = 'syserr';
      div.textContent = '错误：' + (err?.message ?? String(err));
      $(elId).appendChild(div);
    }

    async function boot() {
      try {
        const me = await api('/api/me');
        S.user = me.user;
        if (S.user.role !== 'admin') { document.body.innerHTML = '<main class="container py-3"><p class="syserr">403 forbidden：需要管理员权限。</p></main>'; return; }
      } catch {
        location.href = '/';
        return;
      }
      $('who').textContent = `${S.user.login}（admin）`;
      await Promise.all([loadProviders(), loadUsers()]);
    }

    // ------------------------------------------------------------------
    // LLM 供应商
    // ------------------------------------------------------------------
    async function loadProviders() {
      showErr('llmErr', null);
      try {
        const data = await api('/api/admin/llm/providers');
        S.providers = data.items ?? [];
        renderProviders();
      } catch (e) { showErr('llmErr', e); }
    }

    function typeBadge(t) { return `<span class="badge type">${esc(t)}</span>`; }

    function renderProviders() {
      const list = $('providerList');
      list.innerHTML = '';
      if (S.providers.length === 0) list.innerHTML = '<p class="muted">暂无供应商，先在下方新增。</p>';
      for (const p of S.providers) {
        const card = document.createElement('div');
        card.className = 'card';
        const open = S.expanded.has(p.id);
        const models = p.models ?? [];
        card.innerHTML = `
          <div class="card-body">
          <div class="head">
            <span class="name">${esc(p.name)}</span>
            <span class="url">${esc(p.base_url)}</span>
            <span class="badge ${p.enabled ? 'on' : 'off'}">${p.enabled ? '启用' : '停用'}</span>
            <span class="spacer"></span>
            <button class="btn btn-outline-secondary btn-sm" data-act="models">${open ? '收起模型' : `模型明细（${models.length}）`}</button>
            <button class="btn btn-outline-secondary btn-sm" data-act="toggle">${p.enabled ? '停用' : '启用'}</button>
            <button class="btn btn-outline-danger btn-sm" data-act="del">删除</button>
          </div>
          <div class="detail" style="display:${open ? '' : 'none'}">
            <table class="table table-hover align-middle table-sm">
              <thead><tr><th>model_id</th><th>名称</th><th>类型</th><th>tool_calling</th><th>上下文窗口</th><th>状态</th><th></th></tr></thead>
              <tbody>${models.map((m) => `
                <tr>
                  <td>${esc(m.model_id)}</td>
                  <td>${esc(m.name)}</td>
                  <td>${typeBadge(m.type)}</td>
                  <td>${m.tool_calling ? '✓' : '—'}</td>
                  <td>${m.context_window ?? '—'}</td>
                  <td><span class="badge ${m.enabled ? 'on' : 'off'}">${m.enabled ? '启用' : '停用'}</span></td>
                  <td>
                    <button class="btn btn-outline-secondary btn-sm" data-model="${esc(m.id)}" data-mact="toggle">${m.enabled ? '停用' : '启用'}</button>
                    <button class="btn btn-outline-danger btn-sm" data-model="${esc(m.id)}" data-mact="del">删除</button>
                  </td>
                </tr>`).join('') || '<tr><td colspan="7" class="muted">该供应商下暂无模型</td></tr>'}
              </tbody>
            </table>
            <form class="row g-2 align-items-end mt-2" data-addmodel="${esc(p.id)}">
              <div class="col-md-auto">
                <label class="d-flex flex-column gap-1 small text-muted">model_id<input name="model_id" required placeholder="gpt-4o" class="form-control form-control-sm"></label>
              </div>
              <div class="col-md-auto">
                <label class="d-flex flex-column gap-1 small text-muted">名称<input name="name" required placeholder="GPT-4o" class="form-control form-control-sm"></label>
              </div>
              <div class="col-md-auto">
                <label class="d-flex flex-column gap-1 small text-muted">类型<select name="type" class="form-select form-select-sm">
                  ${['text','embedding','vision','rerank','audio-tts','audio-stt','image-gen'].map((t) => `<option value="${t}">${t}</option>`).join('')}
                </select></label>
              </div>
              <div class="col-md-auto">
                <label class="d-flex flex-column gap-1 small text-muted">上下文窗口<input name="context_window" type="number" min="1" placeholder="128000" class="form-control form-control-sm"></label>
              </div>
              <div class="col-md-auto d-flex align-items-center pb-1">
                <label class="form-check small text-muted mb-0"><input name="tool_calling" type="checkbox" class="form-check-input"> tool_calling</label>
              </div>
              <div class="col-md-auto">
                <button class="btn btn-primary" type="submit">＋ 新增模型</button>
              </div>
            </form>
          </div>
          </div>`;
        list.appendChild(card);

        card.querySelector('[data-act="models"]').onclick = () => {
          if (S.expanded.has(p.id)) S.expanded.delete(p.id); else S.expanded.add(p.id);
          renderProviders();
        };
        card.querySelector('[data-act="toggle"]').onclick = async () => {
          try {
            await api(`/api/admin/llm/providers/${encodeURIComponent(p.id)}`, { method: 'PATCH', body: JSON.stringify({ enabled: !p.enabled }) });
            await loadProviders();
          } catch (e) { showErr('llmErr', e); }
        };
        card.querySelector('[data-act="del"]').onclick = async () => {
          if (!confirm(`确认删除供应商 ${p.name}？其下模型将一并删除。`)) return;
          try {
            await api(`/api/admin/llm/providers/${encodeURIComponent(p.id)}`, { method: 'DELETE' });
            S.expanded.delete(p.id);
            await loadProviders();
          } catch (e) { showErr('llmErr', e); }
        };
        for (const btn of card.querySelectorAll('[data-mact="toggle"]')) {
          btn.onclick = async () => {
            const m = models.find((x) => x.id === btn.dataset.model);
            try {
              await api(`/api/admin/llm/models/${encodeURIComponent(m.id)}`, { method: 'PATCH', body: JSON.stringify({ enabled: !m.enabled }) });
              await loadProviders();
            } catch (e) { showErr('llmErr', e); }
          };
        }
        for (const btn of card.querySelectorAll('[data-mact="del"]')) {
          btn.onclick = async () => {
            const m = models.find((x) => x.id === btn.dataset.model);
            if (!confirm(`确认删除模型 ${m.model_id}？`)) return;
            try {
              await api(`/api/admin/llm/models/${encodeURIComponent(m.id)}`, { method: 'DELETE' });
              await loadProviders();
            } catch (e) { showErr('llmErr', e); }
          };
        }
        const addForm = card.querySelector('[data-addmodel]');
        addForm.onsubmit = async (e) => {
          e.preventDefault();
          const f = e.target;
          try {
            await api(`/api/admin/llm/providers/${encodeURIComponent(p.id)}/models`, {
              method: 'POST',
              body: JSON.stringify({
                model_id: f.model_id.value.trim(),
                name: f.name.value.trim(),
                type: f.type.value,
                tool_calling: f.tool_calling.checked,
                context_window: f.context_window.value ? Number(f.context_window.value) : null,
              }),
            });
            S.expanded.add(p.id);
            await loadProviders();
          } catch (err) { showErr('llmErr', err); }
        };
      }
    }

    $('addProviderForm').onsubmit = async (e) => {
      e.preventDefault();
      const f = e.target;
      try {
        await api('/api/admin/llm/providers', {
          method: 'POST',
          body: JSON.stringify({ name: f.name.value.trim(), base_url: f.base_url.value.trim() }),
        });
        f.reset();
        await loadProviders();
      } catch (err) { showErr('llmErr', err); }
    };

    // ------------------------------------------------------------------
    // FDE 管理
    // ------------------------------------------------------------------
    async function loadUsers() {
      showErr('fdeErr', null);
      try {
        const data = await api('/api/admin/users');
        S.users = data.items ?? [];
        renderUsers();
      } catch (e) { showErr('fdeErr', e); }
    }

    function renderUsers() {
      const list = $('userList');
      list.innerHTML = '';
      if (S.users.length === 0) list.innerHTML = '<p class="muted">暂无用户。</p>';
      for (const u of S.users) {
        const wrap = document.createElement('div');
        wrap.className = 'card';
        const open = S.userExpanded.has(u.id);
        wrap.innerHTML = `
          <div class="card-body">
          <div class="head row-head">
            <span class="name">${esc(u.login)}</span>
            <span class="muted">${esc(u.display_name)}</span>
            <span class="badge type">${esc(u.role)}</span>
            ${u.fde_name ? `<span class="badge on">${esc(u.fde_name)}</span>` : '<span class="muted">无 fde_name</span>'}
            <span class="badge ${u.status === 'active' ? 'on' : 'off'}">${esc(u.status)}</span>
            <span class="spacer"></span>
            <button class="btn btn-outline-secondary btn-sm" data-act="expand">${open ? '收起' : '展开'}</button>
          </div>
          <div class="detail" style="display:${open ? '' : 'none'}">
            <div data-pane="llm"><p class="muted">加载 LLM 配置…</p></div>
          </div>
          </div>`;
        list.appendChild(wrap);
        wrap.querySelector('.row-head').onclick = (ev) => {
          if (ev.target.tagName === 'BUTTON') return;
          if (S.userExpanded.has(u.id)) S.userExpanded.delete(u.id); else S.userExpanded.add(u.id);
          renderUsers();
        };
        wrap.querySelector('[data-act="expand"]').onclick = () => {
          if (S.userExpanded.has(u.id)) S.userExpanded.delete(u.id); else S.userExpanded.add(u.id);
          renderUsers();
        };
        if (open) loadUserLlmPane(wrap.querySelector('[data-pane="llm"]'), u);
      }
    }

    async function loadUserLlmPane(pane, u) {
      if (!u.fde_name) {
        pane.innerHTML = '<p class="muted">该用户未配置 fde_name，无需 LLM 配置。</p>';
        return;
      }
      const fde = encodeURIComponent(u.fde_name);
      let cfg = null;
      let activeRun = false;
      try {
        const data = await api(`/api/admin/fdes/${fde}/llm`);
        cfg = data.config;
        activeRun = data.active_run === true;
      } catch (e) {
        pane.innerHTML = '';
        const div = document.createElement('div');
        div.className = 'syserr';
        div.textContent = '错误：' + e.message;
        pane.appendChild(div);
        return;
      }
      // provider 下拉变化 → 按类型/能力过滤三个模型下拉（main 仅 tool_calling=true 的 text 模型）。
      const providerOpts = S.providers.map((p) =>
        `<option value="${esc(p.id)}" ${cfg && p.id === cfg.provider_id ? 'selected' : ''}>${esc(p.name)}</option>`).join('');
      pane.innerHTML = `
        ${activeRun ? '<div class="warnbox">⚠️ 有活跃 run：更换供应商或 API key 会被服务端拒绝（影响进行中的 run）；纯模型变更不受影响。</div>' : ''}
        <form class="llmform" data-llmform="${fde}">
          <label>供应商<select name="provider_id" class="form-select form-select-sm">${providerOpts}</select></label>
          <label>API Key（<span data-keyhint>${cfg?.api_key ? '已配置 ' + esc(cfg.api_key) + '，重输以修改' : '首次配置必填'}</span>）
            <input name="api_key" type="password" autocomplete="new-password" class="form-control form-control-sm" placeholder="${cfg?.api_key ? '留空 = 保持不变' : ''}"></label>
          <label>主模型（text · tool_calling）<select name="main_model_id" class="form-select form-select-sm"></select></label>
          <label>Embedding（可空）<select name="embedding_model_id" class="form-select form-select-sm"></select></label>
          <label>Vision（可空）<select name="vision_model_id" class="form-select form-select-sm"></select></label>
          <div class="d-flex gap-2 align-items-end">
            <button class="btn btn-primary" type="submit">保存 LLM 配置</button>
            <button class="btn btn-outline-secondary" type="button" data-provision>provision 容器</button>
          </div>
        </form>
        <div data-llmmsg class="mt-2"></div>`;

      const form = pane.querySelector('[data-llmform]');
      const sel = form.provider_id;
      function fillModelSelects() {
        const p = S.providers.find((x) => x.id === sel.value);
        const ms = (p?.models ?? []).filter((m) => m.enabled);
        const optsFor = (type, needTc) => {
          const list = ms.filter((m) => m.type === type && (!needTc || m.tool_calling === true));
          return '<option value="">（不配置）</option>' + list.map((m) =>
            `<option value="${esc(m.id)}" ${cfg && m.model_id === cfg[type === 'text' ? 'main' : type]?.model_id ? 'selected' : ''}>${esc(m.model_id)} — ${esc(m.name)}</option>`).join('');
        };
        form.main_model_id.innerHTML = optsFor('text', true);
        form.embedding_model_id.innerHTML = optsFor('embedding', false);
        form.vision_model_id.innerHTML = optsFor('vision', false);
        if (cfg) {
          if (cfg.main?.model_id) {
            const cur = ms.find((m) => m.model_id === cfg.main.model_id && m.tool_calling === true && m.type === 'text');
            if (cur) form.main_model_id.value = cur.id;
          }
          for (const slot of ['embedding', 'vision']) {
            if (cfg[slot]?.model_id) {
              const cur = ms.find((m) => m.model_id === cfg[slot].model_id && m.type === slot);
              if (cur) form[slot + '_model_id'].value = cur.id;
            }
          }
        }
      }
      fillModelSelects();
      sel.onchange = fillModelSelects;

      form.onsubmit = async (e) => {
        e.preventDefault();
        await submitLlm(false);
      };

      // F6（Round B 评审）：服务端对「活跃 run + 换 provider/key」返回 409 active_run_conflict。
      // UI 必须真实处理 409：展示服务端原因，且只有在管理员**显式点击确认**后才带 force=true 重试——
      // 绝不静默 force（fail-visible：运行中换 provider 会静默改变 run 的上游，必须留人工知情痕迹）。
      async function submitLlm(force) {
        const msg = pane.querySelector('[data-llmmsg]');
        if (!force) msg.innerHTML = '';
        try {
          const body = {
            provider_id: form.provider_id.value,
            main_model_id: form.main_model_id.value || undefined,
            embedding_model_id: form.embedding_model_id.value || null,
            vision_model_id: form.vision_model_id.value || null,
          };
          if (form.api_key.value) body.api_key = form.api_key.value;
          if (force) body.force = true;
          const r = await api(`/api/admin/fdes/${fde}/llm`, { method: 'PUT', body: JSON.stringify(body) });
          const div = document.createElement('div');
          div.className = 'okmsg';
          div.textContent = `已保存：主模型 ${r.config.main.model_id}` + (r.config.api_key ? `（key ${r.config.api_key}）` : '');
          msg.innerHTML = '';
          msg.appendChild(div);
          form.api_key.value = '';
        } catch (err) {
          if (err?.code === 'active_run_conflict' && !force) {
            // 服务端拒绝 → 展示原因 + 显式确认按钮（点击才算知情，才带 force=true 重试）。
            msg.innerHTML = '';
            const div = document.createElement('div');
            div.className = 'syserr';
            div.textContent = '已拒绝（409）：' + err.message;
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'btn btn-outline-secondary btn-sm';
            btn.textContent = '确认无影响，强制保存';
            btn.onclick = () => submitLlm(true);
            msg.appendChild(div);
            msg.appendChild(btn);
            return;
          }
          const div = document.createElement('div');
          div.className = 'syserr';
          div.textContent = '错误：' + err.message;
          msg.innerHTML = '';
          msg.appendChild(div);
        }
      }

      pane.querySelector('[data-provision]').onclick = async () => {
        const msg = pane.querySelector('[data-llmmsg]');
        msg.innerHTML = '';
        try {
          const r = await api(`/api/admin/fdes/${fde}/provision`, { method: 'POST', body: '{}' });
          const div = document.createElement('div');
          div.className = 'okmsg';
          div.textContent = `provision 完成：${r.container}（${r.network} ${r.subnet}）`;
          msg.appendChild(div);
        } catch (err) {
          const div = document.createElement('div');
          div.className = 'syserr';
          div.textContent = '错误：' + err.message;
          msg.appendChild(div);
        }
      };
    }

    $('addUserForm').onsubmit = async (e) => {
      e.preventDefault();
      const f = e.target;
      showErr('fdeErr', null);
      try {
        const body = {
          login: f.login.value.trim(),
          display_name: f.display_name.value.trim(),
          password: f.password.value,
        };
        if (f.fde_name.value.trim()) body.fde_name = f.fde_name.value.trim();
        const r = await api('/api/admin/users', { method: 'POST', body: JSON.stringify(body) });
        // TOTP 种子仅此一次显示（红线）：刷新/重进不再可见。
        const qr = qrcode(0, 'M');
        qr.addData(r.totp_uri);
        qr.make();
        $('totpOnce').innerHTML = `
          <div class="totpbox">
            <img class="qr" src="${qr.createDataURL(4, 8)}" alt="TOTP 认证器二维码">
            <div>用户 <b>${esc(r.user.login)}</b> 已创建。请用认证器 App 录入以下 otpauth URI 或种子（<b>仅此一次显示</b>）：</div>
            <div>otpauth URI：<code>${esc(r.totp_uri)}</code></div>
            <div>TOTP 种子：<code>${esc(r.totp_secret)}</code></div>
            <div>下一步：展开该用户卡片 → 配置 LLM 上游 → 点击 provision 容器；将登录名/口令与本二维码交给用户扫码录入认证器。</div>
          </div>`;
        f.reset();
        await loadUsers();
      } catch (err) { showErr('fdeErr', err); }
    };

    $('logout').onclick = async () => {
      await fetch('/api/auth/logout', { method: 'POST' });
      location.href = '/';
    };

    boot();
  </script>
</body>
</html>
